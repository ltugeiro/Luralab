<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spool — ERP Impressão 3D</title>

<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Spool">

<link rel="icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7;
    --surface:#ffffff;
    --surface-2:#f4f5f8;
    --surface-3:#eceef2;
    --border:#e7e9ee;
    --text:#171a1f;
    --text-dim:#6c7680;
    --text-faint:#9aa2ab;
    --accent:#ff5e2e;
    --accent-2:#ffb02e;
    --accent-dim:#ff5e2e1a;
    --teal:#00b894;
    --teal-dim:#00b8941a;
    --violet:#7c5cff;
    --violet-dim:#7c5cff1a;
    --danger:#ff3b5c;
    --danger-dim:#ff3b5c1a;
    --shadow:0 1px 2px rgba(20,20,30,0.04), 0 6px 20px rgba(20,20,30,0.06);
    --shadow-sm:0 1px 3px rgba(20,20,30,0.06);
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(20,20,30,0.045) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- HEADER ---------- */
  header{
    padding:18px 18px 14px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg) 75%, transparent);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:conic-gradient(from 200deg, var(--accent), var(--accent-2), var(--teal), var(--accent));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 3px 10px rgba(255,94,46,0.28);
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-text h1{font-family:var(--font-display);font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;}
  .brand-text p{margin:0;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px;}
  .tab-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:14px 0 2px;}
  .tab-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 4px;}

  /* ---------- MAIN ---------- */
  main{flex:1;padding:0 16px 100px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow-sm);
  }
  .card.tight{padding:14px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;margin:0 0 6px;}
  .stat-value{font-family:var(--font-mono);font-weight:600;font-size:20px;margin:0;}
  .stat-value.sm{font-size:15px;}
  .stat-value.pos{color:var(--teal);}
  .stat-value.neg{color:var(--danger);}
  .stat-value.accent{color:var(--accent);}
  .section-label{
    font-family:var(--font-display);font-size:12.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);
    margin:20px 2px 10px;display:flex;align-items:center;gap:8px;
  }
  .section-label:first-child{margin-top:4px;}
  .section-label .line{flex:1;height:1px;background:var(--border);}

  /* ---------- NAV ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;justify-content:center;
    z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, var(--bg) 65%, transparent);
  }
  .navbar{
    width:100%;max-width:480px;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    box-shadow:0 -4px 16px rgba(20,20,30,0.05);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .navbtn{
    flex:1;background:none;border:none;color:var(--text-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:var(--font-body);font-size:9.5px;font-weight:600;
    padding:6px 2px;border-radius:10px;cursor:pointer;letter-spacing:.2px;
  }
  .navbtn svg{width:19px;height:19px;}
  .navbtn.active{color:var(--accent);}
  .navbtn.active svg{filter:drop-shadow(0 0 5px var(--accent-dim));}

  /* ---------- FORM ---------- */
  .field{margin-bottom:10px;}
  .field.tight{margin-bottom:8px;}
  .item-cores{margin-top:4px;padding-top:8px;border-top:1px dashed var(--border);}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;}
  .field input, .field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:var(--radius-sm);padding:10px 11px;
    font-family:var(--font-body);font-size:14.5px;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .field input::placeholder{color:var(--text-faint);}
  .note{font-size:11px;color:var(--text-faint);margin-top:5px;line-height:1.4;}

  /* ---------- BUTTONS ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#1a1207;border:none;
    font-family:var(--font-body);font-weight:700;font-size:13.5px;
    padding:11px 16px;border-radius:var(--radius-sm);cursor:pointer;width:100%;
    box-shadow:0 4px 12px rgba(255,94,46,0.25);
  }
  .btn.secondary{background:var(--surface-3);color:var(--text);box-shadow:none;}
  .btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);box-shadow:none;}
  .btn.danger{background:var(--danger-dim);color:var(--danger);box-shadow:none;}
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  .btn-row{display:flex;gap:8px;margin-top:4px;}
  .btn-row .btn{width:auto;flex:1;}
  .fab{
    width:100%;background:var(--surface);border:1.5px dashed var(--border);color:var(--text-dim);
    padding:13px;border-radius:var(--radius);font-weight:700;font-size:13.5px;
    cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .fab:active{background:var(--surface-2);}
  .fab svg{width:16px;height:16px;flex-shrink:0;}
  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;display:flex;}
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.danger-hover:active{color:var(--danger);}

  /* ---------- SEARCH / FILTERS ---------- */
  .search-bar{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  }
  .search-bar svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
  .search-bar input{flex:1;border:none;background:none;font-family:var(--font-body);font-size:13.5px;color:var(--text);outline:none;}
  .search-bar input::placeholder{color:var(--text-faint);}
  .filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
  .filter-row::-webkit-scrollbar{display:none;}
  .chip-select{
    flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    font-family:var(--font-body);font-size:12px;font-weight:600;padding:7px 10px;border-radius:100px;
  }

  /* ---------- LIST ITEMS ---------- */
  .item{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);
  }
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .item-title{font-weight:700;font-size:14.5px;margin:0;}
  .item-meta{font-size:11.5px;color:var(--text-dim);margin:3px 0 0;}
  .item-actions{display:flex;gap:2px;flex-shrink:0;}
  .badge{
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;
    text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;
  }
  .badge.entrada{background:var(--teal-dim);color:var(--teal);}
  .badge.saida{background:var(--danger-dim);color:var(--danger);}
  .badge.pago{background:var(--teal-dim);color:var(--teal);}
  .badge.parcial{background:var(--accent-dim);color:var(--accent);}
  .badge.pendente{background:var(--accent-dim);color:var(--accent);}
  .badge.cat{background:var(--violet-dim);color:var(--violet);}
  .item-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .item-num{font-family:var(--font-mono);font-weight:600;font-size:15px;}

  /* ---------- PARCELAS (pagamentos) ---------- */
  .parcela-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;
  }
  .parcela-row:last-child{border-bottom:none;}
  .parcela-info{color:var(--text-dim);}
  .parcela-info b{color:var(--text);font-family:var(--font-mono);}
  .parcela-btn{
    font-size:11px;font-weight:700;padding:5px 10px;border-radius:100px;border:none;cursor:pointer;
  }
  .parcela-btn.marcar{background:var(--teal-dim);color:var(--teal);}
  .parcela-btn.desfazer{background:var(--surface-3);color:var(--text-faint);}

  .breakdown{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .breakdown-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--text-dim);}
  .breakdown-row span:last-child{font-family:var(--font-mono);color:var(--text);}
  .breakdown-row.total{border-top:1px solid var(--border);margin-top:5px;padding-top:7px;font-weight:700;}
  .breakdown-row.total span{color:var(--text);}

  /* progress bar (parcelas) */
  .pbar-track{width:100%;height:6px;border-radius:100px;background:var(--surface-3);overflow:hidden;margin-top:8px;}
  .pbar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg, var(--accent), var(--teal));}

  /* ring */
  .ring-wrap{display:flex;align-items:center;gap:14px;}
  .ring-num{font-family:var(--font-mono);font-weight:700;font-size:15px;}

  /* segmented control */
  .segmented{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;margin-bottom:14px;border:1px solid var(--border);}
  .segmented button{
    flex:1;background:none;border:none;color:var(--text-dim);font-weight:700;font-size:12.5px;
    padding:8px;border-radius:8px;cursor:pointer;font-family:var(--font-body);
  }
  .segmented button.active{background:var(--surface-3);color:var(--text);}

  .empty{text-align:center;padding:30px 10px;color:var(--text-faint);font-size:13px;}
  .empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.5;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#12171a" stroke-width="2"/><circle cx="12" cy="12" r="2.3" fill="#12171a"/></svg>
      </div>
      <div class="brand-text">
        <h1>Spool</h1>
        <p>ERP · Impressão 3D</p>
      </div>
      <div id="cloud-badge" style="margin-left:auto;"></div>
    </div>
  </header>
  <main id="content"></main>
  <nav>
    <div class="navbar" id="navbar"></div>
  </nav>
</div>

<!-- Firebase (usado apenas para sincronizacao na nuvem, opcional) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
/* =========================================================================
   ICONS (inline SVG, minimal line style)
   ========================================================================= */
const ICONS = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  cube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v9"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2.6 20 10a2 2 0 0 1 0 2.8l-7.6 7.6a2 2 0 0 1-2.8 0l-7.4-7.4a2 2 0 0 1-.6-1.4V4.6A2 2 0 0 1 3.6 2.6H10.6a2 2 0 0 1 2 0Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>',
  chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V6a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 6v12a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7v-2"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
};

/* =========================================================================
   STATE
   ========================================================================= */
const STORAGE_KEY = 'spool-erp-3d';
const CLOUD_CONFIG_KEY = 'spool-cloud-config';

/* =========================================================================
   CLOUD SYNC (Firebase) - opcional. Sem isto configurado, o app funciona
   normalmente guardando os dados so neste aparelho (localStorage).
   ========================================================================= */
let cloudConfig = null;      // { apiKey, authDomain, projectId, ... } colado pelo utilizador
let firebaseApp = null;
let auth = null;
let db = null;
let currentUser = null;      // objeto do utilizador Firebase, quando autenticado
let cloudUnsub = null;       // funcao para cancelar o listener em tempo real do Firestore
let cloudSyncing = false;    // true enquanto aguarda a 1a resposta do Firestore
let ui2 = { authMode:'login', authError:'', authBusy:false, showCloudForm:false };

function loadCloudConfig(){
  try{
    const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
    if(raw) cloudConfig = JSON.parse(raw);
  }catch(e){ cloudConfig = null; }
}
function saveCloudConfig(cfg){
  cloudConfig = cfg;
  try{ localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearCloudConfig(){
  cloudConfig = null;
  try{ localStorage.removeItem(CLOUD_CONFIG_KEY); }catch(e){}
}

function initFirebase(){
  if(!cloudConfig || firebaseApp) return true;
  try{
    firebaseApp = firebase.initializeApp(cloudConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{ /* varios separadores abertos, ou navegador sem suporte - ignorar */ });
    cloudSyncing = true;
    auth.onAuthStateChanged(onAuthStateChanged);
    return true;
  }catch(e){
    console.error('Erro ao iniciar Firebase:', e);
    ui2.authError = 'Não foi possível iniciar a ligação à nuvem. Confira se colou a configuração corretamente.';
    firebaseApp = null;
    return false;
  }
}

function userDocRef(){
  return db.collection('users').doc(currentUser.uid).collection('appdata').doc('main');
}

function onAuthStateChanged(user){
  currentUser = user;
  if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
  if(user){
    ui2.authError = '';
    cloudSyncing = true;
    // ouve alteracoes em tempo real (permite usar em varios aparelhos ao mesmo tempo)
    cloudUnsub = userDocRef().onSnapshot((doc) => {
      cloudSyncing = false;
      if(doc.exists && doc.data() && doc.data().json){
        try{
          state = JSON.parse(doc.data().json);
          migrateState();
        }catch(e){ console.error('Erro a ler dados da nuvem:', e); }
      } else {
        // 1a vez deste utilizador: envia os dados atuais (locais) para a nuvem
        saveState();
      }
      render();
    }, (err) => {
      cloudSyncing = false;
      console.error('Erro de sincronizacao:', err);
      render();
    });
  } else {
    cloudSyncing = false;
    render();
  }
}

async function cloudSignup(email, password){
  ui2.authBusy = true; ui2.authError = ''; render();
  try{
    await auth.createUserWithEmailAndPassword(email, password);
  }catch(e){
    ui2.authError = traduzErroFirebase(e);
  }
  ui2.authBusy = false;
  render();
}
async function cloudLogin(email, password){
  ui2.authBusy = true; ui2.authError = ''; render();
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    ui2.authError = traduzErroFirebase(e);
  }
  ui2.authBusy = false;
  render();
}
async function cloudLogout(){
  try{ await auth.signOut(); }catch(e){}
  render();
}
async function cloudResetPassword(email){

function migrateState(){
  // garante que todas as coleccoes existem, mesmo se os dados guardados forem de uma versao anterior do app
  const defaults = seedState();
  if(!Array.isArray(state.materiais)) state.materiais = [];
  if(!Array.isArray(state.movimentacoes)) state.movimentacoes = [];
  if(!Array.isArray(state.produtos)) state.produtos = [];
  if(!Array.isArray(state.financeiro)) state.financeiro = [];
  if(!Array.isArray(state.investimentos)) state.investimentos = [];
  if(!Array.isArray(state.vendas)) state.vendas = [];
  if(!Array.isArray(state.orcamentos)) state.orcamentos = [];
  if(!state.config || typeof state.config !== 'object') state.config = defaults.config;
  else for(const k in defaults.config){ if(typeof state.config[k] !== 'number') state.config[k] = defaults.config[k]; }

  state.investimentos.forEach(inv=>{
    if(typeof inv.parcelasPagas !== 'number' || isNaN(inv.parcelasPagas)) inv.parcelasPagas = 0;
  });
  state.produtos.forEach(p=>{
    if(!Array.isArray(p.materiais)){
      // migra o formato antigo (um so material por produto) para o novo formato (lista de materiais/cores)
      p.materiais = p.codMaterial ? [{codMaterial:p.codMaterial, peso:num(p.peso)}] : [];
      delete p.codMaterial; delete p.peso;
    }
    if(typeof p.categoria !== 'string') p.categoria = '';
    if(!Array.isArray(p.acessoriosItens)) p.acessoriosItens = [];
  });
  // migra vendas/orçamentos antigos: garante vendedor, comissão, parcelas e a lista de itens (multiplos produtos)
  [...state.vendas, ...state.orcamentos].forEach(v=>{
    if(typeof v.vendedor !== 'string') v.vendedor = '';
    if(typeof v.comissaoPct !== 'number' || isNaN(v.comissaoPct)) v.comissaoPct = 0;
    if(!Array.isArray(v.parcelas)){
      // migra o campo antigo valorReal/total para uma unica parcela, assumindo pago
      v.parcelas = [];
    }
    if(!Array.isArray(v.itens)){
      // migra o formato antigo (um so produto por venda/orcamento) para a lista de itens
      v.itens = v.produto ? [{produto:v.produto, quantidade:num(v.quantidade)||1, materiaisItem:[]}] : [];
      delete v.produto; delete v.quantidade;
    } else {
      v.itens.forEach(it=>{
        if(!Array.isArray(it.materiaisItem)) it.materiaisItem = [];
        delete it.cores; // campo antigo (so cor, sem peso) descontinuado
      });
    }
  });
}

/* =========================================================================
   FORMAT HELPERS
   ========================================================================= */
const fmtEUR = (v) => new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(v||0);
const fmtPct = (v) => ((v||0)*100).toFixed(1).replace('.',',') + '%';
const fmtDate = (iso) => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'short',year:'numeric'}); };
const num = (v, d=2) => { const n=parseFloat(String(v).replace(',', '.')); return isNaN(n)? 0 : n; };

/* =========================================================================
   COMPUTE
   ========================================================================= */
function materialStats(codigo){
  const mat = state.materiais.find(m=>m.id===codigo);
  const entradas = state.movimentacoes.filter(m=>m.codigo===codigo && m.tipo==='Entrada');
  const saidas = state.movimentacoes.filter(m=>m.codigo===codigo && m.tipo==='Saída');
  const entradasQtd = entradas.reduce((s,m)=>s+num(m.qtd),0);
  const entradasValor = entradas.reduce((s,m)=>s+num(m.qtd)*num(m.custoUnit),0);
  const saidasQtd = saidas.reduce((s,m)=>s+num(m.qtd),0);
  const custoMedio = entradasQtd>0 ? entradasValor/entradasQtd : (mat? mat.custoPadrao : 0);
  const estoqueAtual = entradasQtd - saidasQtd;
  const valorEstoque = estoqueAtual * custoMedio;
  return {custoMedio, estoqueAtual, valorEstoque};
}

function pesoTotal(p){
  return (p.materiais||[]).reduce((s,m)=>s+num(m.peso),0);
}
function composicaoTexto(p){
  const parts = (p.materiais||[]).map(m=>{
    if(!m.codMaterial) return `cor a definir na venda (${num(m.peso)}g)`;
    const mat = state.materiais.find(x=>x.id===m.codMaterial);
    return `${mat?mat.nome:'material removido'} (${num(m.peso)}g)`;
  });
  return parts.length ? parts.join(', ') : 'Sem peso definido';
}

function custoMedioReferencial(){
  // custo medio por kg entre todos os materiais tipo filamento/resina cadastrados,
  // usado como estimativa quando um slot de cor ainda nao tem material de referencia definido
  const candidatos = state.materiais.filter(m=>m.tipo==='Filamento' || m.tipo==='Resina');
  const base = candidatos.length ? candidatos : state.materiais;
  if(!base.length) return 0;
  const soma = base.reduce((s,m)=> s + materialStats(m.id).custoMedio, 0);
  return soma / base.length;
}

function produtoCalc(p, materiaisOverride, acessoriosOverride){
  const cfg = state.config;
  const materiaisUsados = materiaisOverride || p.materiais || [];
  const custoMateriaPrima = materiaisUsados.reduce((s,m)=>{
    const custoMedio = m.codMaterial ? materialStats(m.codMaterial).custoMedio : custoMedioReferencial();
    return s + (num(m.peso)/1000) * custoMedio;
  }, 0);
  const acessoriosUsados = acessoriosOverride || p.acessoriosItens || [];
  const custoAcessoriosItens = acessoriosUsados.reduce((s,a)=>{
    if(!a.codAcessorio) return s;
    return s + num(a.quantidade) * materialStats(a.codAcessorio).custoMedio;
  }, 0);
  // valor antigo em euros (formato anterior, mantido para produtos ja cadastrados assim)
  const custoAcessoriosFlat = acessoriosUsados.length ? 0 : num(p.acessorios);
  const custoAcessorios = custoAcessoriosItens + custoAcessoriosFlat;
  const custoEnergia = (cfg.potencia/1000) * num(p.tempo) * cfg.kwh;
  const custoAmortizacao = num(p.tempo) * (cfg.valorMaquina / cfg.vidaUtil);
  const custoFixoRateado = cfg.unidadesMes>0 ? cfg.custoFixoMensal / cfg.unidadesMes : 0;
  const subtotal = custoMateriaPrima + custoEnergia + custoAmortizacao + custoAcessorios + custoFixoRateado;
  const custoTotal = cfg.falhas<1 ? subtotal/(1-cfg.falhas) : subtotal;
  const precoFinal = custoTotal * cfg.markup;
  const lucroBruto = precoFinal - custoTotal;
  const lucroLiquido = lucroBruto * (1 - cfg.imposto - cfg.cartao - cfg.anuncio);
  const precoLojista = precoFinal * cfg.pctLojista;
  const lucroBrutoLojista = precoLojista - custoTotal;
  const lucroLiquidoLojista = lucroBrutoLojista * (1 - cfg.imposto);
  return {custoMateriaPrima, custoAcessorios, custoEnergia, custoAmortizacao, custoFixoRateado, subtotal,
          custoTotal, precoFinal, lucroBruto, lucroLiquido, precoLojista, lucroBrutoLojista, lucroLiquidoLojista};
}

function itensDe(v){
  // suporta o formato novo (v.itens) e faz fallback para o formato antigo (v.produto/v.quantidade)
  if(Array.isArray(v.itens) && v.itens.length) return v.itens;
  if(v.produto) return [{produto:v.produto, quantidade:v.quantidade}];
  return [];
}

function vendaCalc(v){
  const itens = itensDe(v).filter(it=>it.produto);
  let subtotal = 0, custoTotalProduto = 0;
  const detalhes = [];
  itens.forEach(it=>{
    const produto = state.produtos.find(p=>p.id===it.produto);
    if(!produto) return;
    const materiais = materiaisEfetivos(produto, it);
    const pc = produtoCalc(produto, materiais);
    const precoUnit = v.tipoCliente==='Lojista' ? pc.precoLojista : pc.precoFinal;
    const qtd = num(it.quantidade);
    subtotal += qtd * precoUnit;
    custoTotalProduto += qtd * pc.custoTotal;
    detalhes.push({produto, qtd, precoUnit, materiais});
  });
  if(!detalhes.length) return {precoUnit:0, total:0, totalCalculado:0, custoTotalProduto:0, comissaoValor:0, lucro:0, produtoValido:false, detalhes:[]};
  const totalCalculado = subtotal * (1 - num(v.desconto));
  // se o utilizador preencheu um valor real de venda, esse valor manda; senao usa o calculado
  const temValorManual = v.valorReal !== undefined && v.valorReal !== null && v.valorReal !== '';
  const total = temValorManual ? num(v.valorReal) : totalCalculado;
  const comissaoValor = total * (num(v.comissaoPct)/100);
  const lucro = total - custoTotalProduto - comissaoValor;
  return {total, totalCalculado, custoTotalProduto, comissaoValor, lucro, produtoValido:true, temValorManual, detalhes};
}

function orcamentoCalc(o){
  const itens = itensDe(o).filter(it=>it.produto);
  let subtotal = 0;
  const detalhes = [];
  itens.forEach(it=>{
    const produto = state.produtos.find(p=>p.id===it.produto);
    if(!produto) return;
    const materiais = materiaisEfetivos(produto, it);
    const pc = produtoCalc(produto, materiais);
    const precoUnit = o.tipoCliente==='Lojista' ? pc.precoLojista : pc.precoFinal;
    const qtd = num(it.quantidade);
    subtotal += qtd * precoUnit;
    detalhes.push({produto, qtd, precoUnit, materiais});
  });
  if(!detalhes.length) return {precoUnit:0, total:0, totalCalculado:0, produtoValido:false, detalhes:[]};
  const totalCalculado = subtotal * (1 - num(o.desconto));
  const temValorManual = o.valorReal !== undefined && o.valorReal !== null && o.valorReal !== '';
  const total = temValorManual ? num(o.valorReal) : totalCalculado;
  return {precoUnit:0, total, totalCalculado, produtoValido:true, temValorManual, detalhes};
}

  if(!detalhes.length) return 'produto removido';

function addMonthsISO(iso, n){
  const d = new Date((iso||new Date().toISOString().slice(0,10))+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}

// gera N parcelas de igual valor (a ultima absorve o arredondamento), espacadas mensalmente
function gerarParcelas(total, nParcelas, dataInicio){
  const n = Math.max(1, Math.round(nParcelas)||1);
  const base = Math.floor((total/n)*100)/100;
  const parcelas = [];
  let acumulado = 0;
  for(let i=0;i<n;i++){
    const valor = (i===n-1) ? Math.round((total-acumulado)*100)/100 : base;
    acumulado += valor;
    parcelas.push({id:uid('pc'), numero:i+1, valor, dataPrevista:addMonthsISO(dataInicio,i), pago:false, dataPagamento:null});
  }
  return parcelas;
}

function pagamentoCalc(item, total){
  const parcelas = item.parcelas || [];
  const valorPago = parcelas.filter(p=>p.pago).reduce((s,p)=>s+num(p.valor),0);
  const valorFalta = Math.max(0, Math.round((total-valorPago)*100)/100);
  const status = !parcelas.length ? 'Sem registo' : (valorFalta<=0.005 ? 'Pago' : (valorPago>0 ? 'Parcial' : 'Pendente'));
  const comissaoValor = total * (num(item.comissaoPct)/100);
  return {valorPago, valorFalta, status, comissaoValor, nParcelas:parcelas.length,
          nPagas: parcelas.filter(p=>p.pago).length};
}

function statusPagamentoKind(status){
  if(status==='Pago') return 'pago';
  if(status==='Parcial') return 'parcial';
  return 'pendente';
}

function togglePagamentoParcela(collection, itemId, parcelaId){

  parcela.pago = !parcela.pago;

function renderParcelas(collection, item, total){
  const parcelas = item.parcelas || [];
  if(!parcelas.length) return `<div class="note" style="margin-top:8px;">Sem plano de pagamento registado.</div>`;
  return `<div style="margin-top:10px;">` + parcelas.map(p=>`
    <div class="parcela-row">
      <div class="parcela-info">Parcela ${p.numero}/${parcelas.length} · <b>${fmtEUR(p.valor)}</b> · prevista ${fmtDate(p.dataPrevista)}
        ${p.pago ? `<br>Paga em ${fmtDate(p.dataPagamento)}` : ''}
      </div>
      <button class="parcela-btn ${p.pago?'desfazer':'marcar'}" onclick="togglePagamentoParcela('${collection}','${item.id}','${p.id}')">${p.pago?'Desfazer':'Marcar pago'}</button>
    </div>
  `).join('') + `</div>`;
}

function monthsBetween(d1, d2){
  let months = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(d2.getDate() < d1.getDate()) months -= 1;
  return Math.max(0, months);
}
// usado apenas para sugerir um valor inicial ao criar um novo item de investimento
function sugerirParcelasPagas(data1Parcela, nParcelas){
  const hoje = new Date();
  const d1 = new Date(data1Parcela+'T00:00:00');
  if(hoje < d1) return 0;
  return Math.min(nParcelas, monthsBetween(d1,hoje)+1);
}

function investimentoCalc(inv){
  const valorParcela = inv.nParcelas>0 ? inv.valorTotal/inv.nParcelas : inv.valorTotal;
  const parcelasPagas = Math.max(0, Math.min(inv.nParcelas, num(inv.parcelasPagas)));
  const parcelasRestantes = inv.nParcelas - parcelasPagas;
  const valorJaPago = parcelasPagas * valorParcela;
  const valorEmFalta = Math.max(0, inv.valorTotal - valorJaPago);
  const status = valorEmFalta<=0.005 ? 'Pago' : 'Em pagamento';
  return {valorParcela, parcelasPagas, parcelasRestantes, valorJaPago, valorEmFalta, status};
}

// combina a receita registada do produto com os materiais/cores e pesos escolhidos nesta venda/orcamento especifica
// (se o item nao tiver override definido, usa a receita padrao do produto tal como cadastrada)
function materiaisEfetivos(produto, item){
  const receita = produto.materiais || [];
  if(!item || !Array.isArray(item.materiaisItem) || !item.materiaisItem.length) return receita;
  return receita.map((m,i)=>{
    const ov = item.materiaisItem[i] || {};
    return {codMaterial: ov.codMaterial || m.codMaterial, peso: (ov.peso!==undefined && ov.peso!=='' && ov.peso!=null) ? ov.peso : m.peso};
  });
}

function itensComCorFaltando(itens){
  const faltando = [];
  itens.forEach(it=>{
    const produto = state.produtos.find(p=>p.id===it.produto);
    if(!produto) return;
    const materiais = materiaisEfetivos(produto, it);
    if(materiais.some(m=>!m.codMaterial)) faltando.push(produto.nome);
  });
  return faltando;
}

function gerarMovimentosProducao(produto, quantidade, origemLabel, dataStr, materiaisOverride, acessoriosOverride){
  const dataFinal = dataStr || new Date().toISOString().slice(0,10);
  const movsFilamento = (materiaisOverride || produto.materiais || []).filter(m=>m.codMaterial).map(m=>{
    const mat = state.materiais.find(x=>x.id===m.codMaterial);
    const custoUnit = mat ? materialStats(mat.id).custoMedio : 0;
    return {
      id: uid('mv'), data: dataFinal, tipo:'Saída',
      codigo: m.codMaterial, origem: origemLabel,
      qtd: Math.round(((num(m.peso)*quantidade)/1000)*1000)/1000, custoUnit,
      obs: `Produção automática (${quantidade}x ${produto.nome})`
    };
  });
  const movsAcessorios = (acessoriosOverride || produto.acessoriosItens || []).filter(a=>a.codAcessorio).map(a=>{
    const mat = state.materiais.find(x=>x.id===a.codAcessorio);
    const custoUnit = mat ? materialStats(mat.id).custoMedio : 0;
    return {
      id: uid('mv'), data: dataFinal, tipo:'Saída',
      codigo: a.codAcessorio, origem: origemLabel,
      qtd: num(a.quantidade) * quantidade, custoUnit,
      obs: `Produção automática (${quantidade}x ${produto.nome})`
    };
  });
  return [...movsFilamento, ...movsAcessorios];
}

function financeiroOrdenado(){
  const list = [...state.financeiro].sort((a,b)=> a.data.localeCompare(b.data) || a.id.localeCompare(b.id));
  let saldo = 0;
  return list.map(f=>{
    saldo += (f.tipo==='Entrada' ? num(f.valor) : -num(f.valor));
    return {...f, saldoAcumulado: saldo};
  });
}

function painelData(){
  const finOrd = financeiroOrdenado();
  const saldoCaixa = finOrd.length ? finOrd[finOrd.length-1].saldoAcumulado : 0;
  const totalEntradas = state.financeiro.filter(f=>f.tipo==='Entrada').reduce((s,f)=>s+num(f.valor),0);
  const totalSaidas = state.financeiro.filter(f=>f.tipo==='Saída').reduce((s,f)=>s+num(f.valor),0);

  const valorEstoqueTotal = state.materiais.reduce((s,m)=> s + materialStats(m.id).valorEstoque, 0);

  const produtosCalc = state.produtos.map(p=>({...p, calc:produtoCalc(p)}));
  const precoMedio = produtosCalc.length ? produtosCalc.reduce((s,p)=>s+p.calc.precoFinal,0)/produtosCalc.length : 0;
  const lucroMedio = produtosCalc.length ? produtosCalc.reduce((s,p)=>s+p.calc.lucroLiquido,0)/produtosCalc.length : 0;

  const totalInvestido = state.investimentos.reduce((s,i)=>s+num(i.valorTotal),0);
  const invCalcs = state.investimentos.map(i=>({...i, calc:investimentoCalc(i)}));
  const totalJaPago = invCalcs.reduce((s,i)=>s+i.calc.valorJaPago,0);
  const totalDivida = invCalcs.reduce((s,i)=>s+i.calc.valorEmFalta,0);

  const lucroOperacional = totalEntradas - state.financeiro.filter(f=>f.tipo==='Saída' && f.categoria!=='Equipamento').reduce((s,f)=>s+num(f.valor),0);
  const valorPorRecuperar = Math.max(0, totalInvestido - lucroOperacional);
  const pctRecuperado = totalInvestido>0 ? lucroOperacional/totalInvestido : 0;
  const lucroMensalEstimado = lucroMedio * state.config.unidadesMes;
  const mesesEstimados = lucroMensalEstimado>0 ? Math.ceil(valorPorRecuperar/lucroMensalEstimado) : null;

  const vendasCalc = state.vendas.map(v=>({...v, calc:vendaCalc(v)}));
  const totalVendido = vendasCalc.reduce((s,v)=>s+v.calc.total,0);
  const lucroVendas = vendasCalc.reduce((s,v)=>s+v.calc.lucro,0);
  const orcamentosPendentes = state.orcamentos.filter(o=>o.status==='Pendente').length;

  return {saldoCaixa, totalEntradas, totalSaidas, valorEstoqueTotal, produtosCalc, precoMedio, lucroMedio,
          totalInvestido, totalJaPago, totalDivida, lucroOperacional, valorPorRecuperar, pctRecuperado, mesesEstimados,
          totalVendido, lucroVendas, numVendas:state.vendas.length, orcamentosPendentes};
}

function ring(pct, size=58, color='var(--accent)'){
  const clamped = Math.max(0, Math.min(1, pct));
  const r = (size/2) - 5;
  const c = 2*Math.PI*r;
  const offset = c * (1-clamped);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--surface-3)" stroke-width="5" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="5" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function badge(text, kind){ return `<span class="badge ${kind}">${text}</span>`; }

function sectionLabel(text){ return `<div class="section-label">${text}<div class="line"></div></div>`; }

          <select id="f-unidade">
            ${['kg','L','un'].map(u=>`<option ${f&&f.unidade===u?'selected':''}>${u}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>Custo padrão (€/unidade)</label><input id="f-custo" type="number" step="0.01" inputmode="decimal" value="${f?f.custoPadrao:''}"></div>
      <div class="btn-row"><button class="btn" onclick="saveMaterial()">${editing?'Guardar alterações':'Adicionar material'}</button></div>
    </div>`;
  }

  if(!state.materiais.length){
    html += `<div class="empty">${ICONS.box}<div>Nenhum material cadastrado.</div></div>`;
  } else {
    html += `
    <div class="search-bar">
      ${ICONS.search}
      <input placeholder="Pesquisar material..." value="${ui.filtroMateriais.busca}" oninput="setFiltro('filtroMateriais','busca',this.value)">
    </div>
    <div class="filter-row">
      <button class="chip-select" style="${!ui.filtroMateriais.tipo?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroMateriais','tipo','')">Todos</button>
      ${['Filamento','Resina','Acessório','Outro'].map(t=>`<button class="chip-select" style="${ui.filtroMateriais.tipo===t?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroMateriais','tipo','${ui.filtroMateriais.tipo===t?'':t}')">${t}</button>`).join('')}
    </div>`;
  }

  const buscaM = (ui.filtroMateriais.busca||'').toLowerCase();
  const materiaisFiltrados = state.materiais.filter(m=>{
    if(ui.filtroMateriais.tipo && m.tipo!==ui.filtroMateriais.tipo) return false;
    if(buscaM && !m.nome.toLowerCase().includes(buscaM)) return false;
    return true;
  });
  if(state.materiais.length && !materiaisFiltrados.length){
    html += `<div class="empty">${ICONS.box}<div>Nenhum material corresponde à pesquisa.</div></div>`;
  }

  materiaisFiltrados.forEach(m=>{
    const s = materialStats(m.id);
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${m.nome}</p>
          <p class="item-meta">${m.tipo} · ${fmtEUR(m.custoPadrao)}/${m.unidade} (padrão)</p>
        </div>
        <div class="item-actions">
          <button class="icon-btn" onclick="editMaterial('${m.id}')">${ICONS.edit}</button>
          <button class="icon-btn danger-hover" onclick="deleteItem('materiais','${m.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Estoque atual</p><p class="item-num">${s.estoqueAtual.toFixed(2)} ${m.unidade}</p></div>
        <div><p class="stat-label" style="margin:0;">Custo médio</p><p class="item-num">${fmtEUR(s.custoMedio)}</p></div>
        <div><p class="stat-label" style="margin:0;">Valor em estoque</p><p class="item-num accent">${fmtEUR(s.valorEstoque)}</p></div>
      </div>
    </div>`;
  });
  return html;
}

function renderMovimentacoes(){
  const showForm = ui.showForm==='movimento';
  const showProd = ui.showForm==='producao';
  const matOptions = state.materiais.map(m=>`<option value="${m.id}">${m.nome}</option>`).join('');
  const prodOptions = state.produtos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');

  let html = `
  <div class="btn-row">
    <button class="btn secondary" style="flex:1;" onclick="toggleForm('movimento')">${ICONS.plus} Movimentação manual</button>
    <button class="btn" style="flex:1;" onclick="toggleForm('producao')">${ICONS.cube} Registar produção</button>
  </div>
  <div style="height:12px;"></div>`;

  if(showForm){
    html += `
    <div class="card">
      <div class="row-2">
        <div class="field"><label>Data</label><input id="f-data" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Tipo</label><select id="f-tipo"><option>Entrada</option><option>Saída</option></select></div>
      </div>
      <div class="field"><label>Material</label><select id="f-material">${matOptions || '<option value="">Sem materiais</option>'}</select></div>

      <div class="row-2">
        <div class="field"><label>Quantidade</label><input id="f-qtd" type="number" step="0.01" inputmode="decimal"></div>
        <div class="field"><label>Custo unitário (€)</label><input id="f-custounit" type="number" step="0.01" inputmode="decimal"></div>
      </div>
      <div class="field"><label>Observação</label><input id="f-obs" placeholder="Opcional"></div>
      <div class="btn-row"><button class="btn" onclick="saveMovimento()">Adicionar movimentação</button></div>
    </div>`;
  }

  if(showProd){
    html += `
    <div class="card">
      <div class="note" style="margin-bottom:10px;">Escolha um produto e a quantidade produzida — o consumo de cada material da receita é calculado e lançado automaticamente como saída de estoque.</div>
      <div class="field"><label>Produto</label><select id="f-produto">${prodOptions || '<option value="">Sem produtos cadastrados</option>'}</select></div>
      <div class="row-2">
        <div class="field"><label>Quantidade produzida</label><input id="f-qtdprod" type="number" step="1" value="1"></div>
        <div class="field"><label>Data</label><input id="f-dataprod" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="btn-row"><button class="btn" onclick="registrarProducao()">Registar produção e baixar estoque</button></div>
    </div>`;
  }

  html += `
  <div class="segmented">
    <button class="${ui.movFilter==='todas'?'active':''}" onclick="setMovFilter('todas')">Todas</button>
    <button class="${ui.movFilter==='Entrada'?'active':''}" onclick="setMovFilter('Entrada')">Entradas</button>
    <button class="${ui.movFilter==='Saída'?'active':''}" onclick="setMovFilter('Saída')">Saídas</button>
  </div>
  <div class="search-bar">
    ${ICONS.search}
    <input placeholder="Pesquisar por material ou origem..." value="${ui.filtroMovimentos.busca}" oninput="setFiltro('filtroMovimentos','busca',this.value)">
  </div>`;

  let list = [...state.movimentacoes].sort((a,b)=>b.data.localeCompare(a.data));
  if(ui.movFilter!=='todas'){ list = list.filter(m=>m.tipo===ui.movFilter); }
  const buscaMv = (ui.filtroMovimentos.busca||'').toLowerCase();
  if(buscaMv){
    list = list.filter(m=>{
      const mat = state.materiais.find(x=>x.id===m.codigo);
      const alvo = `${mat?mat.nome:''} ${m.origem||''} ${m.obs||''}`.toLowerCase();
      return alvo.includes(buscaMv);
    });
  }
  if(!list.length){ html += `<div class="empty">${ICONS.layers}<div>Nenhuma movimentação encontrada.</div></div>`; }

  list.forEach(m=>{
    const mat = state.materiais.find(x=>x.id===m.codigo);
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${mat? mat.nome : 'Material removido'}</p>
          <p class="item-meta">${fmtDate(m.data)} · ${m.origem||'—'}</p>
        </div>
        <div class="item-actions">
          ${badge(m.tipo, m.tipo==='Entrada'?'entrada':'saida')}
          <button class="icon-btn danger-hover" onclick="deleteItem('movimentacoes','${m.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Quantidade</p><p class="item-num">${m.qtd} ${mat?mat.unidade:''}</p></div>
        <div><p class="stat-label" style="margin:0;">Custo unit.</p><p class="item-num">${fmtEUR(m.custoUnit)}</p></div>
        <div><p class="stat-label" style="margin:0;">Total</p><p class="item-num accent">${fmtEUR(m.qtd*m.custoUnit)}</p></div>
      </div>
    </div>`;
  });
  return html;
}

      <button class="chip-select" style="${ui.filtroFinanceiro.tipo==='Entrada'?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroFinanceiro','tipo','${ui.filtroFinanceiro.tipo==='Entrada'?'':'Entrada'}')">Entradas</button>

      </div>
    </div>`;
  });

  return html;
}

function renderInvestimento(){

    <div class="row-2">
      <div><p class="stat-label">Total investido</p><p class="stat-value sm">${fmtEUR(d.totalInvestido)}</p></div>
      <div><p class="stat-label">Ainda em dívida</p><p class="stat-value sm neg">${fmtEUR(d.totalDivida)}</p></div>
    </div>
  </div>`;

  html += `<div class="card">
    <div class="ring-wrap">
      ${ring(d.pctRecuperado, 58, 'var(--teal)')}
      <div>
        <p class="stat-label" style="margin-bottom:2px;">Recuperado (lucro operacional)</p>
        <p class="ring-num">${fmtPct(d.pctRecuperado)}</p>
      </div>
    </div>
    <div class="row-2" style="margin-top:14px;">
      <div><p class="stat-label">Lucro operacional acumulado</p><p class="stat-value sm ${d.lucroOperacional>=0?'pos':'neg'}">${fmtEUR(d.lucroOperacional)}</p></div>
      <div><p class="stat-label">Por recuperar</p><p class="stat-value sm">${fmtEUR(d.valorPorRecuperar)}</p></div>
    </div>
    <div class="note">${d.mesesEstimados!==null? `Estimativa: ${d.mesesEstimados} ${d.mesesEstimados===1?'mês':'meses'} até recuperar tudo, ao ritmo médio atual.` : 'Cadastre produtos e vendas para estimar o prazo de retorno.'} Este cálculo exclui a categoria "Equipamento" do Financeiro, para não contar o investimento duas vezes.</div>
  </div>`;

  html += `<button class="fab" onclick="toggleForm('investimento')">${ICONS.plus}${showForm?'Fechar':(editing?'A editar item...':'Novo item de investimento')}</button>`;

  if(showForm){
    html += `
    <div class="card">
      <div class="field"><label>Item</label><input id="f-item" placeholder="Ex: Bambu Lab A1 Combo" value="${f?f.item:''}"></div>
      <div class="field"><label>Categoria</label>
        <select id="f-categoria">${['Equipamento','Ferramenta','Software','Outro'].map(c=>`<option ${f&&f.categoria===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="row-2">
        <div class="field"><label>Data da compra</label><input id="f-datacompra" type="date" value="${f?f.dataCompra:new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Valor total (€)</label><input id="f-valortotal" type="number" step="0.01" inputmode="decimal" value="${f?f.valorTotal:''}"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Nº de parcelas</label><input id="f-nparcelas" type="number" step="1" min="1" value="${f?f.nParcelas:1}"></div>
        <div class="field"><label>Data da 1ª parcela</label><input id="f-data1parcela" type="date" value="${f?f.data1Parcela:new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Parcelas já pagas</label><input id="f-parcelaspagas" type="number" step="1" min="0" value="${f?f.parcelasPagas:0}"></div>
      <div class="note">Se pagou à vista, use "1" parcela. Atualize "Parcelas já pagas" sempre que fizer um novo pagamento — os cartões abaixo têm botões rápidos +/− para isso.</div>
      <div class="btn-row"><button class="btn" onclick="saveInvestimento()">${editing?'Guardar alterações':'Adicionar item'}</button></div>
    </div>`;
  }

  if(!state.investimentos.length){ html += `<div class="empty">${ICONS.target}<div>Nenhum item de investimento registado.</div></div>`; }
  else {
    html += `
    <div class="search-bar">
      ${ICONS.search}
      <input placeholder="Pesquisar item..." value="${ui.filtroInvestimentos.busca}" oninput="setFiltro('filtroInvestimentos','busca',this.value)">
    </div>
    <div class="filter-row">
      <button class="chip-select" style="${!ui.filtroInvestimentos.status?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroInvestimentos','status','')">Todos</button>
      <button class="chip-select" style="${ui.filtroInvestimentos.status==='Pago'?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroInvestimentos','status','${ui.filtroInvestimentos.status==='Pago'?'':'Pago'}')">Pago</button>
      <button class="chip-select" style="${ui.filtroInvestimentos.status==='Em pagamento'?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroInvestimentos','status','${ui.filtroInvestimentos.status==='Em pagamento'?'':'Em pagamento'}')">Em pagamento</button>
      ${['Equipamento','Ferramenta','Software','Outro'].map(c=>`<button class="chip-select" style="${ui.filtroInvestimentos.categoria===c?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroInvestimentos','categoria','${ui.filtroInvestimentos.categoria===c?'':c}')">${c}</button>`).join('')}
    </div>`;
  }

  const buscaI = (ui.filtroInvestimentos.busca||'').toLowerCase();
  const investimentosFiltrados = state.investimentos.filter(inv=>{
    if(ui.filtroInvestimentos.categoria && inv.categoria!==ui.filtroInvestimentos.categoria) return false;
    if(ui.filtroInvestimentos.status && investimentoCalc(inv).status!==ui.filtroInvestimentos.status) return false;
    if(buscaI && !inv.item.toLowerCase().includes(buscaI)) return false;
    return true;
  });
  if(state.investimentos.length && !investimentosFiltrados.length){
    html += `<div class="empty">${ICONS.target}<div>Nenhum item corresponde à pesquisa.</div></div>`;
  }

  investimentosFiltrados.forEach(inv=>{
    const c = investimentoCalc(inv);
    const pct = inv.nParcelas>0 ? c.parcelasPagas/inv.nParcelas : 1;
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${inv.item}</p>
          <p class="item-meta">${inv.categoria} · comprado em ${fmtDate(inv.dataCompra)}</p>
        </div>
        <div class="item-actions">
          ${badge(c.status, c.status==='Pago'?'pago':'pendente')}
          <button class="icon-btn" onclick="editInvestimento('${inv.id}')">${ICONS.edit}</button>
          <button class="icon-btn danger-hover" onclick="deleteItem('investimentos','${inv.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Valor total</p><p class="item-num">${fmtEUR(inv.valorTotal)}</p></div>
        <div><p class="stat-label" style="margin:0;">Parcelas</p><p class="item-num">${c.parcelasPagas}/${inv.nParcelas}</p></div>
        <div><p class="stat-label" style="margin:0;">Em falta</p><p class="item-num neg">${fmtEUR(c.valorEmFalta)}</p></div>
      </div>
      <div class="pbar-track"><div class="pbar-fill" style="width:${(pct*100).toFixed(0)}%;"></div></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn secondary" style="flex:1;" onclick="bumpParcela('${inv.id}', -1)" ${c.parcelasPagas<=0?'disabled':''}>− Parcela paga</button>
        <button class="btn secondary" style="flex:1;" onclick="bumpParcela('${inv.id}', 1)" ${c.parcelasPagas>=inv.nParcelas?'disabled':''}>+ Marcar parcela paga</button>
      </div>
    </div>`;
  });

  return html;
}

function renderVendas(){
  let html = `<div class="tab-title">Vendas</div><p class="tab-sub">Registo de vendas e orçamentos para clientes.</p>`;
  html += `
  <div class="segmented">
    <button class="${ui.vendasSub==='vendas'?'active':''}" onclick="setVendasSub('vendas')">Vendas</button>

      <button class="btn ghost" style="margin-bottom:12px;" onclick="addPedidoItem('vendaForm')">${ICONS.plus} Adicionar produto</button>

      <div class="row-2">
        <div class="field"><label>Tipo de cliente</label><select onchange="updatePedidoForm('vendaForm','tipoCliente',this.value)">${clienteTipoOptions(vf.tipoCliente)}</select></div>
        <div class="field"><label>Desconto (%)</label><input type="number" step="1" value="${vf.desconto}" onchange="updatePedidoForm('vendaForm','desconto',this.value)"></div>
      </div>
      <div class="field"><label>Comissão vendedor (%)</label><input type="number" step="1" value="${vf.comissaoPct}" onchange="updatePedidoForm('vendaForm','comissaoPct',this.value)"></div>
      <div class="row-2">
        <div class="field"><label>Valor sugerido (€)</label><input type="text" value="${fmtEUR(pedidoValorSugerido('vendaForm'))}" disabled style="opacity:.55;"></div>
        <div class="field"><label>Valor real vendido (€)</label><input type="text" inputmode="decimal" value="${vf.valorReal}" placeholder="Ex: 45,00" onchange="updatePedidoForm('vendaForm','valorReal',this.value)"></div>
      </div>
      <div class="note">"Valor sugerido" é calculado automaticamente (soma dos produtos × desconto) e não pode ser editado. Preencha "Valor real vendido" com o que realmente recebeu — se deixar em branco, o valor sugerido é usado.</div>
      <div class="field"><label>Forma de pagamento</label><input value="${vf.forma}" placeholder="MB Way, cartão..." onchange="updatePedidoForm('vendaForm','forma',this.value)"></div>
      <div class="field"><label>Data da venda</label><input type="date" value="${vf.data}" onchange="updatePedidoForm('vendaForm','data',this.value)"></div>
      <div class="row-2">
        <div class="field"><label>Nº de parcelas</label><input type="number" step="1" min="1" value="${vf.nParcelas}" onchange="updatePedidoForm('vendaForm','nParcelas',this.value)"></div>
        <div class="field"><label>Data do 1º pagamento</label><input type="date" value="${vf.dataParc}" onchange="updatePedidoForm('vendaForm','dataParc',this.value)"></div>
      </div>
      <div class="note">Deixe "Nº de parcelas" em 1 para pagamento à vista. Depois de registada, marque cada parcela como paga na lista abaixo.</div>
      <div class="field"><label>Observação</label><input value="${vf.obs}" placeholder="Opcional" onchange="updatePedidoForm('vendaForm','obs',this.value)"></div>
      <div class="note">Ao guardar, isto cria automaticamente uma entrada em Financeiro e baixa o estoque dos materiais usados.</div>
      <div class="btn-row"><button class="btn" onclick="saveVenda()">Registar venda</button></div>
    </div>`;
  }

  const categoriasV = [...new Set(state.produtos.map(p=>p.categoria).filter(Boolean))];
  html += `
  <div class="search-bar">
    ${ICONS.search}
    <input placeholder="Pesquisar por cliente, vendedor ou produto..." value="${ui.filtroVendas.busca}" oninput="setFiltro('filtroVendas','busca',this.value)">
  </div>
  <div class="filter-row">
    <button class="chip-select" style="${!ui.filtroVendas.status?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroVendas','status','')">Todos</button>
    ${['Pago','Parcial','Pendente'].map(s=>`<button class="chip-select" style="${ui.filtroVendas.status===s?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroVendas','status','${s}')">${s}</button>`).join('')}
    ${categoriasV.map(c=>`<button class="chip-select" style="${ui.filtroVendas.categoria===c?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroVendas','categoria','${ui.filtroVendas.categoria===c?'':c}')">${c}</button>`).join('')}
  </div>`;

  const buscaV = (ui.filtroVendas.busca||'').toLowerCase();
  const list = [...state.vendas].sort((a,b)=>b.data.localeCompare(a.data)).filter(v=>{
    const c = vendaCalc(v);
    const categoriasItem = c.detalhes.map(d=>d.produto.categoria);
    if(ui.filtroVendas.categoria && !categoriasItem.includes(ui.filtroVendas.categoria)) return false;
    if(buscaV){
      const nomesProdutos = c.detalhes.map(d=>d.produto.nome).join(' ');
      const alvo = `${v.cliente} ${v.vendedor||''} ${nomesProdutos}`.toLowerCase();
      if(!alvo.includes(buscaV)) return false;
    }
    if(ui.filtroVendas.status){
      const pg = pagamentoCalc(v, c.total);
      if(pg.status!==ui.filtroVendas.status) return false;
    }
    return true;
  });
  if(!state.vendas.length){ html += `<div class="empty">${ICONS.trend}<div>Nenhuma venda registada.</div></div>`; }
  else if(!list.length){ html += `<div class="empty">${ICONS.trend}<div>Nenhuma venda corresponde à pesquisa.</div></div>`; }

  list.forEach(v=>{
    const c = vendaCalc(v);
    const pg = pagamentoCalc(v, c.total);
    const exp = ui.expanded['ven-'+v.id];
    html += `
    <div class="item">
      <div class="item-top" onclick="toggleExpand('ven-${v.id}')" style="cursor:pointer;">
        <div>
          <p class="item-title">${v.cliente} ${c.temValorManual?badge('valor real','pago'):''}</p>
          <p class="item-meta">${fmtDate(v.data)} · ${itensResumoTexto(c.detalhes)} · ${v.tipoCliente}</p>
          <p class="item-meta">${v.vendedor?'Vendedor: '+v.vendedor:'Sem vendedor definido'}${v.comissaoPct?' · comissão '+v.comissaoPct+'% ('+fmtEUR(pg.comissaoValor)+')':''}</p>
        </div>
        <div class="item-actions">
          ${badge(pg.status, statusPagamentoKind(pg.status))}
          <button class="icon-btn danger-hover" onclick="event.stopPropagation();deleteItem('vendas','${v.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Total</p><p class="item-num accent">${fmtEUR(c.total)}</p></div>
        <div><p class="stat-label" style="margin:0;">Lucro líquido</p><p class="item-num pos">${fmtEUR(c.lucro)}</p></div>
        <div><p class="stat-label" style="margin:0;">Pago / Falta</p><p class="item-num" style="font-size:12.5px;">${fmtEUR(pg.valorPago)} / ${fmtEUR(pg.valorFalta)}</p></div>
      </div>
      ${exp ? renderParcelas('vendas', v, c.total) : ''}
    </div>`;
  });
  return html;
}

  let html = `<button class="fab" onclick="toggleForm('orcamento')">${ICONS.plus}${showForm?'Fechar':'Novo orçamento'}</button>`;

    html += `
    <div class="card">
      <div class="row-2">
        <div class="field"><label>Cliente</label><input value="${of.cliente}" placeholder="Nome do cliente" onchange="updatePedidoForm('orcamentoForm','cliente',this.value)"></div>

      ${of.itens.map((it,i)=>renderPedidoItemRow('orcamentoForm', it, i, of.itens.length>1)).join('')}
      <button class="btn ghost" style="margin-bottom:12px;" onclick="addPedidoItem('orcamentoForm')">${ICONS.plus} Adicionar produto</button>

      <div class="row-2">
        <div class="field"><label>Tipo de cliente</label><select onchange="updatePedidoForm('orcamentoForm','tipoCliente',this.value)">${clienteTipoOptions(of.tipoCliente)}</select></div>
        <div class="field"><label>Desconto (%)</label><input type="number" step="1" value="${of.desconto}" onchange="updatePedidoForm('orcamentoForm','desconto',this.value)"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Comissão vendedor (%)</label><input type="number" step="1" value="${of.comissaoPct}" onchange="updatePedidoForm('orcamentoForm','comissaoPct',this.value)"></div>
        <div class="field"><label>Validade</label><input type="date" value="${of.validade}" onchange="updatePedidoForm('orcamentoForm','validade',this.value)"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Valor sugerido (€)</label><input type="text" value="${fmtEUR(pedidoValorSugerido('orcamentoForm'))}" disabled style="opacity:.55;"></div>
        <div class="field"><label>Valor real do orçamento (€)</label><input type="text" inputmode="decimal" value="${of.valorReal}" placeholder="Ex: 45,00" onchange="updatePedidoForm('orcamentoForm','valorReal',this.value)"></div>
      </div>
      <div class="note">"Valor sugerido" é calculado automaticamente e não pode ser editado. Preencha "Valor real do orçamento" se propôs um valor diferente ao cliente — se deixar em branco, o valor sugerido é usado.</div>
      <div class="row-2">
        <div class="field"><label>Sinal — nº de parcelas</label><input type="number" step="1" min="0" value="${of.nParcelas}" onchange="updatePedidoForm('orcamentoForm','nParcelas',this.value)"></div>
        <div class="field"><label>Data do 1º pagamento</label><input type="date" value="${of.dataParc}" onchange="updatePedidoForm('orcamentoForm','dataParc',this.value)"></div>
      </div>
      <div class="note">Deixe "Sinal" em 0 se o cliente ainda não pagou nada. Depois de criado, pode marcar pagamentos (sinal/parcelas) na lista abaixo.</div>
      <div class="field"><label>Observação</label><input value="${of.obs}" placeholder="Opcional" onchange="updatePedidoForm('orcamentoForm','obs',this.value)"></div>
      <div class="btn-row"><button class="btn" onclick="saveOrcamento()">Criar orçamento</button></div>
    </div>`;
  }

  const categoriasO = [...new Set(state.produtos.map(p=>p.categoria).filter(Boolean))];
  html += `
  <div class="search-bar">
    ${ICONS.search}
    <input placeholder="Pesquisar por cliente, vendedor ou produto..." value="${ui.filtroOrcamentos.busca}" oninput="setFiltro('filtroOrcamentos','busca',this.value)">
  </div>
  <div class="filter-row">
    <button class="chip-select" style="${!ui.filtroOrcamentos.status?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroOrcamentos','status','')">Todos</button>
    ${['Pendente','Aceite','Recusado','Expirado','Convertido'].map(s=>`<button class="chip-select" style="${ui.filtroOrcamentos.status===s?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroOrcamentos','status','${ui.filtroOrcamentos.status===s?'':s}')">${s}</button>`).join('')}
    ${categoriasO.map(c=>`<button class="chip-select" style="${ui.filtroOrcamentos.categoria===c?'background:var(--surface-3);color:var(--text);':''}" onclick="setFiltro('filtroOrcamentos','categoria','${ui.filtroOrcamentos.categoria===c?'':c}')">${c}</button>`).join('')}
  </div>`;

  const buscaO = (ui.filtroOrcamentos.busca||'').toLowerCase();
  const list = [...state.orcamentos].sort((a,b)=>b.data.localeCompare(a.data)).filter(o=>{
    const c = orcamentoCalc(o);
    const categoriasItem = c.detalhes.map(d=>d.produto.categoria);
    if(ui.filtroOrcamentos.categoria && !categoriasItem.includes(ui.filtroOrcamentos.categoria)) return false;
    if(ui.filtroOrcamentos.status && o.status!==ui.filtroOrcamentos.status) return false;
    if(buscaO){
      const nomesProdutos = c.detalhes.map(d=>d.produto.nome).join(' ');
      const alvo = `${o.cliente} ${o.vendedor||''} ${nomesProdutos} ${o.codigo}`.toLowerCase();
      if(!alvo.includes(buscaO)) return false;
    }
    return true;
  });
  if(!state.orcamentos.length){ html += `<div class="empty">${ICONS.target}<div>Nenhum orçamento registado.</div></div>`; }
  else if(!list.length){ html += `<div class="empty">${ICONS.target}<div>Nenhum orçamento corresponde à pesquisa.</div></div>`; }

  const statusKind = (s)=> (s==='Aceite'||s==='Convertido') ? 'pago' : (s==='Recusado'||s==='Expirado' ? 'saida' : 'pendente');

  list.forEach(o=>{
    const c = orcamentoCalc(o);
    const pg = pagamentoCalc(o, c.total);
    const exp = ui.expanded['orc-'+o.id];
    html += `
    <div class="item">
      <div class="item-top" onclick="toggleExpand('orc-${o.id}')" style="cursor:pointer;">
        <div>
          <p class="item-title">${o.codigo} · ${o.cliente} ${c.temValorManual?badge('valor real','pago'):''}</p>
          <p class="item-meta">${fmtDate(o.data)} · ${itensResumoTexto(c.detalhes)} · válido até ${fmtDate(o.validade)}</p>
          <p class="item-meta">${o.vendedor?'Vendedor: '+o.vendedor:'Sem vendedor definido'}${o.comissaoPct?' · comissão '+o.comissaoPct+'% ('+fmtEUR(pg.comissaoValor)+')':''}${pg.nParcelas?' · '+pg.nPagas+'/'+pg.nParcelas+' pagas':''}</p>
        </div>
        <div class="item-actions">
          ${badge(o.status, statusKind(o.status))}
          <button class="icon-btn danger-hover" onclick="event.stopPropagation();deleteItem('orcamentos','${o.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Total</p><p class="item-num accent">${fmtEUR(c.total)}</p></div>
        <div><p class="stat-label" style="margin:0;">Pago / Falta</p><p class="item-num" style="font-size:12.5px;">${fmtEUR(pg.valorPago)} / ${fmtEUR(pg.valorFalta)}</p></div>
      </div>
      ${exp ? renderParcelas('orcamentos', o, c.total) : ''}
      <div class="btn-row" style="margin-top:10px;">
        ${o.status==='Pendente' ? `<button class="btn secondary" style="flex:1;" onclick="setOrcamentoStatus('${o.id}','Aceite')">Marcar aceite</button>
        <button class="btn ghost" style="flex:1;" onclick="setOrcamentoStatus('${o.id}','Recusado')">Recusar</button>` : ''}
        ${o.status==='Aceite' ? `<button class="btn" style="flex:1;" onclick="converterOrcamentoEmVenda('${o.id}')">Converter em venda</button>` : ''}
      </div>
    </div>`;
  });
  return html;
}

function renderCloudSection(){
  if(!cloudConfig){
    if(!ui2.showCloudForm){
      return `

        <p style="font-size:13px;color:var(--text-dim);margin:0 0 12px;">Sem sincronização configurada — os dados ficam só neste aparelho/navegador. Configure a nuvem para aceder aos mesmos dados de qualquer telemóvel ou computador.</p>
        <button class="btn" onclick="ui2.showCloudForm=true; render();">Configurar sincronização na nuvem</button>
      </div>`;
    }
    return `
    <div class="card">
      <p style="font-size:13px;color:var(--text-dim);margin:0 0 10px;">Cole aqui a configuração do seu projeto Firebase (veja o guia "COMO_ATIVAR_NUVEM.md"). Isto fica guardado só neste navegador.</p>

        <button class="btn" style="flex:1;" onclick="saveCloudConfigFromForm()">Guardar e continuar</button>
      </div>
    </div>`;
  }

  if(!currentUser){
    return `
    <div class="card">
      <div class="segmented">
        <button class="${ui2.authMode==='login'?'active':''}" onclick="ui2.authMode='login'; ui2.authError=''; render();">Iniciar sessão</button>

      ${ui2.authError ? `<div class="note" style="color:var(--danger);margin-bottom:8px;">${ui2.authError}</div>` : ''}
      <div class="btn-row">
        <button class="btn" style="flex:1;" ${ui2.authBusy?'disabled':''} onclick="submitAuthForm()">${ui2.authBusy ? 'A processar…' : (ui2.authMode==='login' ? 'Iniciar sessão' : 'Criar conta')}</button>
      </div>
      ${ui2.authMode==='login' ? `<button class="btn ghost" style="width:100%;margin-top:8px;" onclick="cloudResetPassword(document.getElementById('f-authemail').value)">Esqueci a password</button>` : ''}
      <div class="note" style="margin-top:10px;">Isto liga-se ao projeto Firebase configurado. <a href="#" onclick="event.preventDefault(); clearCloudConfig(); render();" style="color:var(--text-dim);">Usar outra configuração</a></div>
    </div>`;
  }

  return `
  <div class="card">
    <p class="stat-label">Sincronizado como</p>
    <p style="font-size:14px;font-weight:700;margin:2px 0 14px;">${currentUser.email}</p>

    <div class="note" style="margin-top:10px;">Os seus dados estão guardados na nuvem e sincronizam automaticamente em qualquer aparelho onde iniciar sessão com este e-mail.</div>
  </div>`;
}

function saveCloudConfigFromForm(){
  const raw = document.getElementById('f-cloudconfig').value.trim();
  let cfg;
  try{ cfg = JSON.parse(raw); }
  catch(e){ ui2.authError = 'JSON inválido. Copie exatamente o objeto de configuração do Firebase.'; render(); return; }
  if(!cfg.apiKey || !cfg.projectId){ ui2.authError = 'Faltam campos na configuração (apiKey/projectId).'; render(); return; }
  ui2.authError = '';
  ui2.showCloudForm = false;
  saveCloudConfig(cfg);
  initFirebase();
  render();
}
function submitAuthForm(){
  const email = document.getElementById('f-authemail').value.trim();
  const pass = document.getElementById('f-authpass').value;
  if(!email || !pass){ ui2.authError = 'Preencha e-mail e password.'; render(); return; }
  if(ui2.authMode==='signup') cloudSignup(email, pass);
  else cloudLogin(email, pass);
}

function saveVenda(){
  const vf = ui.vendaForm;
  const itensValidos = vf.itens.filter(it=>it.produto && num(it.quantidade)>0);
  if(!itensValidos.length){ alert('Selecione pelo menos um produto com quantidade válida.'); return; }
  if(!vf.cliente.trim()){ alert('Indique o nome do cliente.'); return; }
  const semCor = itensComCorFaltando(itensValidos);
  if(semCor.length && !confirm(`Ainda não escolheu a cor usada para: ${semCor.join(', ')}. Guardar mesmo assim? (o estoque desses materiais não será descontado até escolher a cor)`)) return;
  const nParcelas = Math.max(1, Math.round(num(vf.nParcelas)) || 1);
  const venda = {id:uid('ven'), data:vf.data, cliente:vf.cliente.trim(), vendedor:vf.vendedor.trim(),
                 itens: itensValidos.map(it=>({produto:it.produto, quantidade:num(it.quantidade), materiaisItem:(it.materiaisItem||[]).map(m=>({...m}))})),
                 tipoCliente:vf.tipoCliente, desconto:num(vf.desconto)/100, comissaoPct:num(vf.comissaoPct),
                 valorReal: vf.valorReal!=='' ? num(vf.valorReal) : null, forma:vf.forma.trim(), obs:vf.obs.trim(), parcelas:[]};
  const calc = vendaCalc(venda);
  venda.parcelas = gerarParcelas(calc.total, nParcelas, vf.dataParc || vf.data);
  state.vendas.push(venda);
  // cria automaticamente a entrada de caixa correspondente
  state.financeiro.push({
    id:uid('fin'), data:vf.data, tipo:'Entrada', categoria:'Venda',
    descricao:`Venda: ${itensResumoTexto(calc.detalhes)} - ${venda.cliente}`,
    produto: venda.itens[0].produto, valor:Math.round(calc.total*100)/100, forma:venda.forma
  });
  // baixa o estoque dos materiais usados, para cada produto vendido
  calc.detalhes.forEach(d=>{
    const movs = gerarMovimentosProducao(d.produto, d.qtd, `Venda - ${venda.cliente}`, vf.data, d.materiais);
    state.movimentacoes.push(...movs);
  });
  ui.showForm = null;
  ui.vendaForm = null;
  persistAndRender();
}

  const codigo = 'ORC' + String(state.orcamentos.length+1).padStart(3,'0');
  const data = new Date().toISOString().slice(0,10);
  const orcamento = {id:uid('orc'), codigo, data, cliente:of.cliente.trim(), vendedor:of.vendedor.trim(),
                     itens: itensValidos.map(it=>({produto:it.produto, quantidade:num(it.quantidade), materiaisItem:(it.materiaisItem||[]).map(m=>({...m}))})),
                     tipoCliente:of.tipoCliente, desconto:num(of.desconto)/100, comissaoPct:num(of.comissaoPct),
                     valorReal: of.valorReal!=='' ? num(of.valorReal) : null, validade:of.validade, status:'Pendente',
                     obs:of.obs.trim(), parcelas:[]};
  const nParcelas = Math.max(0, Math.round(num(of.nParcelas)) || 0);

function converterOrcamentoEmVenda(id){
  const o = state.orcamentos.find(x=>x.id===id);
  if(!o) return;
  const calcOrc = orcamentoCalc(o);
  if(!calcOrc.detalhes.length){ alert('Nenhum produto válido neste orçamento.'); return; }
  const data = new Date().toISOString().slice(0,10);
  const venda = {id:uid('ven'), data, cliente:o.cliente, vendedor:o.vendedor||'', itens:itensDe(o),
                 tipoCliente:o.tipoCliente, desconto:o.desconto, comissaoPct:o.comissaoPct||0, valorReal:o.valorReal ?? null, forma:'',
                 obs:`Convertido do orçamento ${o.codigo}`, parcelas:(o.parcelas||[]).map(p=>({...p, id:uid('pc')}))};
  const calc = vendaCalc(venda);
  // se o orcamento nao tinha nenhum plano de pagamento, cria uma parcela unica (por pagar) com o valor total
  if(!venda.parcelas.length){
    venda.parcelas = gerarParcelas(calc.total, 1, data);
  }
  state.vendas.push(venda);
  state.financeiro.push({
    id:uid('fin'), data, tipo:'Entrada', categoria:'Venda',
    descricao:`Venda: ${itensResumoTexto(calc.detalhes)} - ${o.cliente} (orçamento ${o.codigo})`,
    produto:venda.itens[0].produto, valor:Math.round(calc.total*100)/100, forma:''
  });
  calc.detalhes.forEach(d=>{
    const movs = gerarMovimentosProducao(d.produto, d.qtd, `Venda - ${o.cliente}`, data, d.materiais);
    state.movimentacoes.push(...movs);
  });
  o.status = 'Convertido';
  persistAndRender();
}
