<style>
  :root{
    --bg:#12171a;
    --surface:#1a2126;
    --surface-2:#212a30;
    --surface-3:#293338;
    --border:#2c3439;
    --text:#eef2f3;
    --text-dim:#93a3ab;
    --text-faint:#5f7178;
    --accent:#ff6b2c;
    --accent-dim:#ff6b2c33;
    --teal:#00c2a8;
    --teal-dim:#00c2a833;
    --danger:#ff5470;
    --danger-dim:#ff547033;
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  svg{width:16px;height:16px;flex-shrink:0;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- HEADER ---------- */
  header{
    padding:18px 18px 14px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:conic-gradient(from 200deg, var(--accent), var(--teal), var(--accent));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-text h1{font-family:var(--font-display);font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;}
  .brand-text p{margin:0;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px;}
  .tab-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:14px 0 2px;}
  .tab-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 4px;}

  /* ---------- MAIN ---------- */
  main{flex:1;padding:0 16px 100px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .card.tight{padding:14px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;margin:0 0 6px;}
  .stat-value{font-family:var(--font-mono);font-weight:600;font-size:20px;margin:0;}
  .stat-value.sm{font-size:15px;}
  .stat-value.pos{color:var(--teal);}
  .stat-value.neg{color:var(--danger);}
  .stat-value.accent{color:var(--accent);}
  .section-label{
    font-family:var(--font-display);font-size:12.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);
    margin:20px 2px 10px;display:flex;align-items:center;gap:8px;
  }
  .section-label:first-child{margin-top:4px;}
  .section-label .line{flex:1;height:1px;background:var(--border);}

  /* ---------- NAV ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;justify-content:center;
    z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg, var(--bg) 60%, transparent);
  }
  .navbar{
    width:100%;max-width:480px;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .navbtn{
    flex:1;background:none;border:none;color:var(--text-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:var(--font-body);font-size:9.5px;font-weight:600;
    padding:6px 2px;border-radius:10px;cursor:pointer;letter-spacing:.2px;
  }
  .navbtn svg{width:19px;height:19px;}
  .navbtn.active{color:var(--accent);}
  .navbtn.active svg{filter:drop-shadow(0 0 5px var(--accent-dim));}

  /* ---------- FORM ---------- */
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;}
  .field input, .field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:var(--radius-sm);padding:10px 11px;
    font-family:var(--font-body);font-size:14.5px;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .field input::placeholder{color:var(--text-faint);}
  .note{font-size:11px;color:var(--text-faint);margin-top:5px;line-height:1.4;}

  /* compact variant used inside "+ adicionar" item-row boxes, to reduce their height */
  .field.compact{margin-bottom:6px;}
  .field.compact label{margin-bottom:3px;font-size:9.5px;}
  .field.compact input, .field.compact select{padding:7px 9px;font-size:13px;}
  .item-row-box{padding:10px;margin-bottom:7px;}

  /* ---------- BUTTONS ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);color:#151312;border:none;
    font-family:var(--font-body);font-weight:700;font-size:13.5px;
    padding:11px 16px;border-radius:var(--radius-sm);cursor:pointer;width:100%;
  }
  .btn.secondary{background:var(--surface-3);color:var(--text);}
  .btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn.danger{background:var(--danger-dim);color:var(--danger);}
  .btn-row{display:flex;gap:8px;margin-top:4px;}
  .btn-row .btn{width:auto;flex:1;}
  .fab{
    width:100%;background:var(--surface-2);border:1.5px dashed var(--border);color:var(--text-dim);
    padding:13px;border-radius:var(--radius);font-weight:700;font-size:13.5px;
    cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .fab:active{background:var(--surface-3);}
  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;display:flex;}
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.danger-hover:active{color:var(--danger);}

  /* ---------- LIST ITEMS ---------- */
  .item{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:9px;
  }
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .item-title{font-weight:700;font-size:14.5px;margin:0;}
  .item-meta{font-size:11.5px;color:var(--text-dim);margin:3px 0 0;}
  .item-actions{display:flex;gap:2px;flex-shrink:0;}
  .badge{
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;
    text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;
  }
  .badge.entrada{background:var(--teal-dim);color:var(--teal);}
  .badge.saida{background:var(--danger-dim);color:var(--danger);}
  .badge.pago{background:var(--teal-dim);color:var(--teal);}
  .badge.pendente{background:var(--accent-dim);color:var(--accent);}
  .item-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .item-num{font-family:var(--font-mono);font-weight:600;font-size:15px;}

  .breakdown{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .breakdown-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--text-dim);}
  .breakdown-row span:last-child{font-family:var(--font-mono);color:var(--text);}
  .breakdown-row.total{border-top:1px solid var(--border);margin-top:5px;padding-top:7px;font-weight:700;}
  .breakdown-row.total span{color:var(--text);}

  /* progress bar (parcelas) */
  .pbar-track{width:100%;height:6px;border-radius:100px;background:var(--surface-3);overflow:hidden;margin-top:8px;}
  .pbar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg, var(--accent), var(--teal));}

  /* ring */
  .ring-wrap{display:flex;align-items:center;gap:14px;}
  .ring-num{font-family:var(--font-mono);font-weight:700;font-size:15px;}

  /* segmented control */
  .segmented{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;margin-bottom:14px;border:1px solid var(--border);}
  .segmented button{
    flex:1;background:none;border:none;color:var(--text-dim);font-weight:700;font-size:12.5px;
    padding:8px;border-radius:8px;cursor:pointer;font-family:var(--font-body);
  }
  .segmented button.active{background:var(--surface-3);color:var(--text);}

  .empty{text-align:center;padding:30px 10px;color:var(--text-faint);font-size:13px;}
  .empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.5;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>

/* =========================================================================
   STATE
   ========================================================================= */
const STORAGE_KEY = 'spool-erp-3d';
const CLOUD_CONFIG_KEY = 'spool-cloud-config';

/* =========================================================================
   CLOUD SYNC (Firebase) - opcional. Sem isto configurado, o app funciona
   normalmente guardando os dados so neste aparelho (localStorage).
   ========================================================================= */
let cloudConfig = null;      // { apiKey, authDomain, projectId, ... } colado pelo utilizador
let firebaseApp = null;
let auth = null;
let db = null;
let currentUser = null;      // objeto do utilizador Firebase, quando autenticado
let cloudUnsub = null;       // funcao para cancelar o listener em tempo real do Firestore
let cloudSyncing = false;    // true enquanto aguarda a 1a resposta do Firestore
let ui2 = { authMode:'login', authError:'', authBusy:false, showCloudForm:false };

function loadCloudConfig(){
  try{
    const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
    if(raw) cloudConfig = JSON.parse(raw);
  }catch(e){ cloudConfig = null; }
}
function saveCloudConfig(cfg){
  cloudConfig = cfg;
  try{ localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearCloudConfig(){
  cloudConfig = null;
  try{ localStorage.removeItem(CLOUD_CONFIG_KEY); }catch(e){}
}

function initFirebase(){
  if(!cloudConfig || firebaseApp) return true;
  try{
    firebaseApp = firebase.initializeApp(cloudConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{ /* varios separadores abertos, ou navegador sem suporte - ignorar */ });
    cloudSyncing = true;
    auth.onAuthStateChanged(onAuthStateChanged);
    return true;
  }catch(e){
    console.error('Erro ao iniciar Firebase:', e);
    ui2.authError = 'Não foi possível iniciar a ligação à nuvem. Confira se colou a configuração corretamente.';
    firebaseApp = null;
    return false;
  }
}

function userDocRef(){
  return db.collection('users').doc(currentUser.uid).collection('appdata').doc('main');
}

function onAuthStateChanged(user){
  currentUser = user;
  if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
  if(user){
    ui2.authError = '';
    cloudSyncing = true;
    // ouve alteracoes em tempo real (permite usar em varios aparelhos ao mesmo tempo)
    cloudUnsub = userDocRef().onSnapshot((doc) => {
      cloudSyncing = false;
      if(doc.exists && doc.data() && doc.data().json){
        try{
          state = JSON.parse(doc.data().json);
          migrateState();
        }catch(e){ console.error('Erro a ler dados da nuvem:', e); }
      } else {
        // 1a vez deste utilizador: envia os dados atuais (locais) para a nuvem
        saveState();
      }
      render();
    }, (err) => {
      cloudSyncing = false;
      console.error('Erro de sincronizacao:', err);
      render();
    });
  } else {
    cloudSyncing = false;
    render();
  }
}

async function cloudSignup(email, password){
  ui2.authBusy = true; ui2.authError = ''; render();
  try{
    await auth.createUserWithEmailAndPassword(email, password);
  }catch(e){
    ui2.authError = traduzErroFirebase(e);
  }
  ui2.authBusy = false;
  render();
}
async function cloudLogin(email, password){
  ui2.authBusy = true; ui2.authError = ''; render();
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    ui2.authError = traduzErroFirebase(e);
  }
  ui2.authBusy = false;
  render();
}
async function cloudLogout(){
  try{ await auth.signOut(); }catch(e){}
  render();
}
async function cloudResetPassword(email){
  if(!email){ alert('Escreva o seu e-mail no campo acima primeiro.'); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    alert('Enviámos um e-mail para redefinir a password.');
  }catch(e){
    alert(traduzErroFirebase(e));
  }
}
function traduzErroFirebase(e){
  const code = e && e.code || '';
  const map = {
    'auth/email-already-in-use': 'Este e-mail já está registado. Tente iniciar sessão.',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/weak-password': 'A password deve ter pelo menos 6 caracteres.',
    'auth/wrong-password': 'Password incorreta.',
    'auth/user-not-found': 'Não existe conta com este e-mail.',
    'auth/too-many-requests': 'Demasiadas tentativas. Aguarde um pouco e tente de novo.',
    'auth/invalid-api-key': 'A configuração da nuvem parece inválida. Confira os dados colados.',
    'auth/network-request-failed': 'Falha de ligação à internet.',
  };
  return map[code] || (e && e.message) || 'Ocorreu um erro. Tente novamente.';
}

function migrateState(){
  // garante que todas as coleccoes existem, mesmo se os dados guardados forem de uma versao anterior do app
  const defaults = seedState();
  if(!Array.isArray(state.materiais)) state.materiais = [];
  if(!Array.isArray(state.movimentacoes)) state.movimentacoes = [];
  if(!Array.isArray(state.produtos)) state.produtos = [];
  if(!Array.isArray(state.financeiro)) state.financeiro = [];
  if(!Array.isArray(state.investimentos)) state.investimentos = [];
  if(!Array.isArray(state.vendas)) state.vendas = [];
  if(!Array.isArray(state.orcamentos)) state.orcamentos = [];
  if(!state.config || typeof state.config !== 'object') state.config = defaults.config;
  else for(const k in defaults.config){ if(typeof state.config[k] !== 'number') state.config[k] = defaults.config[k]; }

  state.investimentos.forEach(inv=>{
    if(typeof inv.parcelasPagas !== 'number' || isNaN(inv.parcelasPagas)) inv.parcelasPagas = 0;
  });
  state.produtos.forEach(p=>{
    if(!Array.isArray(p.partes)){
      if(Array.isArray(p.materiais)){
        // migra o formato anterior (materiais com cor fixa) para o novo formato (so peso, cor livre)
        p.partes = p.materiais.map(m=>({peso:num(m.peso)}));
        delete p.materiais;
      } else if(p.codMaterial){
        // migra o formato ainda mais antigo (um so material por produto)
        p.partes = [{peso:num(p.peso)}];
        delete p.codMaterial; delete p.peso;
      } else {
        p.partes = [];
      }
    }
    if(!Array.isArray(p.itensAdicionais)){
      // migra o campo antigo "acessorios" (um so valor) para a lista de itens com descricao+custo
      p.itensAdicionais = num(p.acessorios)>0 ? [{descricao:'Acessórios/embalagem', custo:num(p.acessorios)}] : [];
      delete p.acessorios;
    }
  });
  state.vendas.forEach(v=>{
    if(!Array.isArray(v.itens)){
      // migra o formato anterior (1 produto por venda) para o novo formato (lista de itens)
      v.itens = v.produto ? [{produto:v.produto, quantidade:num(v.quantidade), materiaisEscolhidos:v.materiaisEscolhidos||[]}] : [];
      delete v.produto; delete v.quantidade; delete v.materiaisEscolhidos;
    }
    if(typeof v.nifCliente !== 'string') v.nifCliente = '';
  });
  state.orcamentos.forEach(o=>{
    if(!Array.isArray(o.itens)){
      o.itens = o.produto ? [{produto:o.produto, quantidade:num(o.quantidade), materiaisEscolhidos:o.materiaisEscolhidos||[]}] : [];
      delete o.produto; delete o.quantidade; delete o.materiaisEscolhidos;
    }
    if(typeof o.nifCliente !== 'string') o.nifCliente = '';
  });
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ /* no saved state yet — keep seed */ }
  try{ migrateState(); }catch(e){ console.error('Erro na migracao de dados:', e); }
  loadCloudConfig();
  render();
  if(cloudConfig){ initFirebase(); }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Erro ao guardar', e); }
  if(cloudConfig && currentUser && db){
    try{ await userDocRef().set({json: JSON.stringify(state), updatedAt: Date.now()}); }
    catch(e){ console.error('Erro ao sincronizar com a nuvem:', e); }
  }
}
function persistAndRender(){ saveState(); render(); }

const fmtEUR = (v) => new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(v||0);
const fmtPct = (v) => ((v||0)*100).toFixed(1).replace('.',',') + '%';
const fmtDate = (iso) => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'short',year:'numeric'}); };
const num = (v, d=2) => { const n=parseFloat(String(v).replace(',', '.')); return isNaN(n)? 0 : n; };

/* =========================================================================
   COMPUTE
   ========================================================================= */
function materialStats(codigo){
  const mat = state.materiais.find(m=>m.id===codigo);
  const entradas = state.movimentacoes.filter(m=>m.codigo===codigo && m.tipo==='Entrada');
  const saidas = state.movimentacoes.filter(m=>m.codigo===codigo && (m.tipo==='Saída' || m.tipo==='Refugo'));
  const entradasQtd = entradas.reduce((s,m)=>s+num(m.qtd),0);
  const entradasValor = entradas.reduce((s,m)=>s+num(m.qtd)*num(m.custoUnit),0);
  const saidasQtd = saidas.reduce((s,m)=>s+num(m.qtd),0);
  const custoMedio = entradasQtd>0 ? entradasValor/entradasQtd : (mat? mat.custoPadrao : 0);
  const estoqueAtual = entradasQtd - saidasQtd;
  const valorEstoque = estoqueAtual * custoMedio;
  return {custoMedio, estoqueAtual, valorEstoque};
}

function custoMedioFilamento(){
  const filamentos = state.materiais.filter(m=>m.tipo==='Filamento');
  const lista = filamentos.length ? filamentos : state.materiais;
  if(!lista.length) return 0;
  const soma = lista.reduce((s,m)=> s + materialStats(m.id).custoMedio, 0);
  return soma / lista.length;
}

function pesoTotal(p){
  return (p.partes||[]).reduce((s,parte)=>s+num(parte.peso),0);
}
function composicaoTexto(p, materiaisEscolhidos){
  const partes = p.partes || [];
  if(!partes.length) return 'Sem peso definido';
  return partes.map((parte,i)=>{
    const codMat = materiaisEscolhidos && materiaisEscolhidos[i];
    if(codMat){
      const mat = state.materiais.find(x=>x.id===codMat);
      return `${mat?mat.nome:'material removido'} (${num(parte.peso)}g)`;
    }
    return `Cor ${i+1} (${num(parte.peso)}g)`;
  }).join(', ');
}

// materiaisEscolhidos (opcional): array de codigos de material, um por "cor"/parte, na mesma ordem
// de p.partes. Se nao for passado (ex.: catalogo de Produtos), usa o custo medio dos filamentos
// cadastrados como estimativa, ja que a cor real so e definida na hora da venda.
function custoItensAdicionais(p){
  return (p.itensAdicionais||[]).reduce((s,item)=>s+num(item.custo),0);
}

function produtoCalc(p, materiaisEscolhidos){
  const cfg = state.config;
  const partes = p.partes || [];
  const custoMedioFil = custoMedioFilamento();
  const custoMateriaPrima = partes.reduce((s, parte, i)=>{
    const codMat = materiaisEscolhidos && materiaisEscolhidos[i];
    const custoUnit = codMat ? materialStats(codMat).custoMedio : custoMedioFil;
    return s + (num(parte.peso)/1000) * custoUnit;
  }, 0);
  const custoEnergia = (cfg.potencia/1000) * num(p.tempo) * cfg.kwh;
  const custoAmortizacao = num(p.tempo) * (cfg.valorMaquina / cfg.vidaUtil);
  const custoFixoRateado = cfg.unidadesMes>0 ? cfg.custoFixoMensal / cfg.unidadesMes : 0;
  const custoItensAdic = custoItensAdicionais(p);
  const subtotal = custoMateriaPrima + custoEnergia + custoAmortizacao + custoItensAdic + custoFixoRateado;
  const custoTotal = cfg.falhas<1 ? subtotal/(1-cfg.falhas) : subtotal;
  const precoFinal = custoTotal * cfg.markup;
  const lucroBruto = precoFinal - custoTotal;
  const lucroLiquido = lucroBruto * (1 - cfg.imposto - cfg.cartao - cfg.anuncio);
  const precoLojista = precoFinal * cfg.pctLojista;
  const lucroBrutoLojista = precoLojista - custoTotal;
  const lucroLiquidoLojista = lucroBrutoLojista * (1 - cfg.imposto);
  return {custoMateriaPrima, custoEnergia, custoAmortizacao, custoFixoRateado, custoItensAdic, subtotal,
          custoTotal, precoFinal, lucroBruto, lucroLiquido, precoLojista, lucroBrutoLojista, lucroLiquidoLojista,
          usouMediaFilamento: !materiaisEscolhidos};
}


// calcula o total/custo somando todos os itens (produtos) de uma venda ou orcamento.
// v.itens: [{produto, quantidade, materiaisEscolhidos}], v.tipoCliente e v.desconto se aplicam ao pedido inteiro.
function calcularItens(v){
  const itens = v.itens || [];
  let precoBruto = 0, custoTotalProduto = 0;
  const itensCalc = itens.map(item=>{
    const produto = state.produtos.find(p=>p.id===item.produto);
    if(!produto) return {...item, produtoValido:false, precoUnit:0, subtotal:0, custo:0};
    const pc = produtoCalc(produto, item.materiaisEscolhidos);
    const precoUnit = v.tipoCliente==='Lojista' ? pc.precoLojista : pc.precoFinal;
    const subtotal = num(item.quantidade) * precoUnit;
    const custo = num(item.quantidade) * pc.custoTotal;
    precoBruto += subtotal;
    custoTotalProduto += custo;
    return {...item, produtoValido:true, precoUnit, subtotal, custo, produtoNome:produto.nome};
  });
  const totalCalculado = precoBruto * (1 - num(v.desconto));
  return {itensCalc, totalCalculado, custoTotalProduto, produtoValido: itens.length>0 && itensCalc.every(i=>i.produtoValido)};
}

function vendaCalc(v){
  const {itensCalc, totalCalculado, custoTotalProduto, produtoValido} = calcularItens(v);
  const temValorManual = v.valorReal !== undefined && v.valorReal !== null && v.valorReal !== '';
  const total = temValorManual ? num(v.valorReal) : totalCalculado;
  const lucro = total - custoTotalProduto;
  return {total, totalCalculado, custoTotalProduto, lucro, produtoValido, temValorManual, itensCalc};
}

function orcamentoCalc(o){
  const {itensCalc, totalCalculado, custoTotalProduto, produtoValido} = calcularItens(o);
  const temValorManual = o.valorReal !== undefined && o.valorReal !== null && o.valorReal !== '';
  const total = temValorManual ? num(o.valorReal) : totalCalculado;
  const lucro = total - custoTotalProduto;
  return {total, totalCalculado, custoTotalProduto, lucro, produtoValido, temValorManual, itensCalc};
}

function monthsBetween(d1, d2){
  let months = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(d2.getDate() < d1.getDate()) months -= 1;
  return Math.max(0, months);
}
// usado apenas para sugerir um valor inicial ao criar um novo item de investimento
function sugerirParcelasPagas(data1Parcela, nParcelas){
  const hoje = new Date();
  const d1 = new Date(data1Parcela+'T00:00:00');
  if(hoje < d1) return 0;
  return Math.min(nParcelas, monthsBetween(d1,hoje)+1);
}

function investimentoCalc(inv){
  const valorParcela = inv.nParcelas>0 ? inv.valorTotal/inv.nParcelas : inv.valorTotal;
  const parcelasPagas = Math.max(0, Math.min(inv.nParcelas, num(inv.parcelasPagas)));
  const parcelasRestantes = inv.nParcelas - parcelasPagas;
  const valorJaPago = parcelasPagas * valorParcela;
  const valorEmFalta = Math.max(0, inv.valorTotal - valorJaPago);
  const status = valorEmFalta<=0.005 ? 'Pago' : 'Em pagamento';
  return {valorParcela, parcelasPagas, parcelasRestantes, valorJaPago, valorEmFalta, status};
}

// materiaisEscolhidos: array de codigos de material (um por "cor"/parte do produto) realmente usados
function gerarMovimentosProducao(produto, quantidade, origemLabel, dataStr, materiaisEscolhidos){
  return (produto.partes||[]).map((parte, i)=>{
    const codMaterial = materiaisEscolhidos && materiaisEscolhidos[i];
    if(!codMaterial) return null;
    const mat = state.materiais.find(x=>x.id===codMaterial);
    const custoUnit = mat ? materialStats(mat.id).custoMedio : 0;
    return {
      id: uid('mv'), data: dataStr || new Date().toISOString().slice(0,10), tipo:'Saída',
      codigo: codMaterial, origem: origemLabel,
      qtd: Math.round(((num(parte.peso)*quantidade)/1000)*1000)/1000, custoUnit,
      obs: `Produção automática (${quantidade}x ${produto.nome})`
    };
  }).filter(Boolean);
}

// gera as movimentacoes de baixa de estoque para TODOS os itens de uma venda/orcamento
function gerarMovimentosParaItens(itens, origemLabel, dataStr){
  const movs = [];
  itens.forEach(item=>{
    const produto = state.produtos.find(p=>p.id===item.produto);
    if(!produto) return;
    movs.push(...gerarMovimentosProducao(produto, num(item.quantidade), origemLabel, dataStr, item.materiaisEscolhidos));
  });
  return movs;
}


function financeiroOrdenado(){
  const list = [...state.financeiro].sort((a,b)=> a.data.localeCompare(b.data) || a.id.localeCompare(b.id));
  let saldo = 0;
  return list.map(f=>{
    saldo += (f.tipo==='Entrada' ? num(f.valor) : -num(f.valor));
    return {...f, saldoAcumulado: saldo};
  });
}

function periodoParaIntervalo(periodo, custom){
  const hoje = new Date();
  const fmt = (dt) => dt.toISOString().slice(0,10);
  if(periodo==='hoje'){ const s=fmt(hoje); return {inicio:s, fim:s}; }
  if(periodo==='semana'){ const ini = new Date(hoje); ini.setDate(hoje.getDate()-6); return {inicio:fmt(ini), fim:fmt(hoje)}; }
  if(periodo==='mes'){ const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1); return {inicio:fmt(ini), fim:fmt(hoje)}; }
  if(periodo==='ano'){ const ini = new Date(hoje.getFullYear(), 0, 1); return {inicio:fmt(ini), fim:fmt(hoje)}; }
  if(periodo==='personalizado'){ return {inicio:(custom&&custom.inicio)||null, fim:(custom&&custom.fim)||null}; }
  return {inicio:null, fim:null}; // 'tudo'
}
function dentroPeriodo(dataStr, intervalo){
  if(!dataStr) return false;
  if(intervalo.inicio && dataStr < intervalo.inicio) return false;
  if(intervalo.fim && dataStr > intervalo.fim) return false;
  return true;
}
function periodoLabel(periodo, custom){
  const nomes = {hoje:'Hoje', semana:'Últimos 7 dias', mes:'Este mês', ano:'Este ano', tudo:'Sempre'};
  if(periodo==='personalizado'){
    if(custom && custom.inicio && custom.fim) return `${fmtDate(custom.inicio)} – ${fmtDate(custom.fim)}`;
    return 'Período personalizado';
  }
  return nomes[periodo] || 'Este mês';
}

function painelData(){
  const intervalo = periodoParaIntervalo(ui.painelPeriodo, ui.painelPeriodoCustom);

  const finOrd = financeiroOrdenado();
  const saldoCaixa = finOrd.length ? finOrd[finOrd.length-1].saldoAcumulado : 0;
  const financeiroPeriodo = state.financeiro.filter(f=>dentroPeriodo(f.data, intervalo));
  const totalEntradas = financeiroPeriodo.filter(f=>f.tipo==='Entrada').reduce((s,f)=>s+num(f.valor),0);
  const totalSaidas = financeiroPeriodo.filter(f=>f.tipo==='Saída').reduce((s,f)=>s+num(f.valor),0);

  const valorEstoqueTotal = state.materiais.reduce((s,m)=> s + materialStats(m.id).valorEstoque, 0);

  const produtosCalc = state.produtos.map(p=>({...p, calc:produtoCalc(p)}));
  const precoMedio = produtosCalc.length ? produtosCalc.reduce((s,p)=>s+p.calc.precoFinal,0)/produtosCalc.length : 0;
  const lucroMedio = produtosCalc.length ? produtosCalc.reduce((s,p)=>s+p.calc.lucroLiquido,0)/produtosCalc.length : 0;

  const totalInvestido = state.investimentos.reduce((s,i)=>s+num(i.valorTotal),0);
  const invCalcs = state.investimentos.map(i=>({...i, calc:investimentoCalc(i)}));
  const totalJaPago = invCalcs.reduce((s,i)=>s+i.calc.valorJaPago,0);
  const totalDivida = invCalcs.reduce((s,i)=>s+i.calc.valorEmFalta,0);

  // recuperacao do investimento continua sendo sempre acumulada (desde sempre), independente do filtro de periodo
  const totalEntradasGeral = state.financeiro.filter(f=>f.tipo==='Entrada').reduce((s,f)=>s+num(f.valor),0);
  const lucroOperacional = totalEntradasGeral - state.financeiro.filter(f=>f.tipo==='Saída' && f.categoria!=='Equipamento').reduce((s,f)=>s+num(f.valor),0);
  const valorPorRecuperar = Math.max(0, totalInvestido - lucroOperacional);
  const pctRecuperado = totalInvestido>0 ? lucroOperacional/totalInvestido : 0;
  const lucroMensalEstimado = lucroMedio * state.config.unidadesMes;
  const mesesEstimados = lucroMensalEstimado>0 ? Math.ceil(valorPorRecuperar/lucroMensalEstimado) : null;

  const vendasCalcTodas = state.vendas.map(v=>({...v, calc:vendaCalc(v)}));
  const vendasPeriodo = vendasCalcTodas.filter(v=>dentroPeriodo(v.data, intervalo));
  const totalVendido = vendasPeriodo.reduce((s,v)=>s+v.calc.total,0);
  const lucroVendas = vendasPeriodo.reduce((s,v)=>s+v.calc.lucro,0);
  const orcamentosPendentes = state.orcamentos.filter(o=>o.status==='Pendente').length;

  // historico mensal (agrupa TODAS as vendas por mes/ano, sem filtro de periodo, para dar visao completa)
  const porMes = {};
  vendasCalcTodas.forEach(v=>{
    const chave = (v.data||'').slice(0,7); // "AAAA-MM"
    if(!chave) return;
    if(!porMes[chave]) porMes[chave] = {vendido:0, lucro:0, n:0};
    porMes[chave].vendido += v.calc.total;
    porMes[chave].lucro += v.calc.lucro;
    porMes[chave].n += 1;
  });
  const historicoMensal = Object.keys(porMes).sort().reverse().map(chave=>({chave, ...porMes[chave]}));

  const mesAtual = new Date().toISOString().slice(0,7);
  const vendidoMesAtual = porMes[mesAtual] ? porMes[mesAtual].vendido : 0;
  const metaMensal = num(state.config.metaMensal);
  const pctMeta = metaMensal>0 ? vendidoMesAtual/metaMensal : 0;

  return {saldoCaixa, totalEntradas, totalSaidas, valorEstoqueTotal, produtosCalc, precoMedio, lucroMedio,
          totalInvestido, totalJaPago, totalDivida, lucroOperacional, valorPorRecuperar, pctRecuperado, mesesEstimados,
          totalVendido, lucroVendas, numVendas:vendasPeriodo.length, orcamentosPendentes,
          historicoMensal, vendidoMesAtual, metaMensal, pctMeta,
          periodoLabel: periodoLabel(ui.painelPeriodo, ui.painelPeriodoCustom)};
}

/* =========================================================================
   SMALL UI COMPONENTS
   ========================================================================= */
function ring(pct, size=58, color='var(--accent)'){
  const clamped = Math.max(0, Math.min(1, pct));
  const r = (size/2) - 5;
  const c = 2*Math.PI*r;
  const offset = c * (1-clamped);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--surface-3)" stroke-width="5" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="5" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function badge(text, kind){ return `<span class="badge ${kind}">${text}</span>`; }

function sectionLabel(text){ return `<div class="section-label">${text}<div class="line"></div></div>`; }

/* =========================================================================

function mesLabel(chave){
  const [ano, mes] = chave.split('-');
  const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${nomes[parseInt(mes,10)-1]}/${ano}`;
}

   RENDER: PRODUTOS

function renderProdutos(){
  const showForm = ui.showForm==='produto';
  const editing = ui.editing.produto;
  const pf = ui.produtoForm; // {nome, tempo, partes:[{peso}], itensAdicionais:[{descricao,custo}]}

  let html = `<div class="tab-title">Produtos</div><p class="tab-sub">Custo e preço de venda calculados automaticamente. Defina só o peso de cada cor — a cor real é escolhida na hora da venda.</p>`;

  html += `<button class="fab" onclick="toggleForm('produto')">${ICONS.plus}${showForm? 'Fechar' : (editing?'A editar produto...':'Novo produto')}</button>`;

  if(showForm && pf){
    html += `
    <div class="card">
      <div class="field"><label>Nome do modelo / peça</label><input id="f-nome" placeholder="Ex: Vaso hexagonal" value="${pf.nome}" onchange="updateProdutoForm('nome', this.value)"></div>
      <div class="field"><label>Tempo de impressão (h)</label><input id="f-tempo" type="number" step="0.1" inputmode="decimal" value="${pf.tempo}" onchange="updateProdutoForm('tempo', this.value)"></div>

      <label style="display:block;font-size:11px;color:var(--text-dim);margin:12px 0 7px;text-transform:uppercase;letter-spacing:.6px;">Peso por cor</label>
      ${pf.partes.map((parte, i)=>`
        <div style="display:flex;gap:7px;align-items:flex-end;margin-bottom:6px;">
          <div class="field compact" style="flex:1;margin-bottom:0;"><label>Cor ${i+1} — Peso (g)</label>
            <input type="number" step="1" inputmode="decimal" value="${parte.peso}" onchange="updateProdutoFormParte(${i}, this.value)">
          </div>
          ${pf.partes.length>1 ? `<button class="icon-btn danger-hover" style="padding:7px 6px;" onclick="removeProdutoFormParte(${i})">${ICONS.trash}</button>` : ''}
        </div>
      `).join('')}
      ${pf.partes.length<4 ? `<button class="btn secondary" style="margin-bottom:12px;" onclick="addProdutoFormParte()">${ICONS.plus} Adicionar outra cor</button>` : ''}
      <div class="note" style="margin-bottom:12px;">Não escolha o material/cor aqui — isso é feito na hora de cada venda. O custo abaixo usa a média do custo dos filamentos cadastrados como estimativa.</div>

      <label style="display:block;font-size:11px;color:var(--text-dim);margin:12px 0 7px;text-transform:uppercase;letter-spacing:.6px;">Acessórios / embalagem</label>
      ${pf.itensAdicionais.map((item, i)=>`
        <div style="display:flex;gap:7px;align-items:flex-end;margin-bottom:6px;">
          <div class="field compact" style="flex:2;margin-bottom:0;"><label>Item</label>
            <input placeholder="Ex: Caixa, ímã, etiqueta" value="${item.descricao}" onchange="updateProdutoFormItemAdicional(${i}, 'descricao', this.value)">
          </div>
          <div class="field compact" style="flex:1;margin-bottom:0;"><label>Custo (€)</label>
            <input type="text" inputmode="decimal" value="${item.custo}" placeholder="Ex: 0,20" onchange="updateProdutoFormItemAdicional(${i}, 'custo', this.value)">
          </div>
          ${pf.itensAdicionais.length>1 ? `<button class="icon-btn danger-hover" style="padding:7px 6px;" onclick="removeProdutoFormItemAdicional(${i})">${ICONS.trash}</button>` : ''}
        </div>
      `).join('')}
      <button class="btn secondary" style="margin-bottom:12px;" onclick="addProdutoFormItemAdicional()">${ICONS.plus} Adicionar item</button>

      <div class="btn-row">
        <button class="btn" onclick="saveProduto()">${editing?'Guardar alterações':'Adicionar produto'}</button>
      </div>
    </div>`;
  }

  if(!state.produtos.length){
    html += `<div class="empty">${ICONS.cube}<div>Ainda não tem produtos cadastrados.</div></div>`;
  }

  state.produtos.forEach(p=>{
    const c = produtoCalc(p);
    const exp = ui.expanded['prod-'+p.id];
    const multi = (p.partes||[]).length > 1;
    html += `
    <div class="item">
      <div class="item-top" onclick="toggleExpand('prod-${p.id}')" style="cursor:pointer;">
        <div>
          <p class="item-title">${p.nome} ${multi?badge('multi-cor','pendente'):''}</p>
          <p class="item-meta">${p.tempo}h · ${pesoTotal(p)}g · ${composicaoTexto(p)}</p>
        </div>
        <div class="item-actions">
          <button class="icon-btn" onclick="event.stopPropagation();editProduto('${p.id}')">${ICONS.edit}</button>
          <button class="icon-btn danger-hover" onclick="event.stopPropagation();deleteItem('produtos','${p.id}')">${ICONS.trash}</button>
          <span class="icon-btn" style="transform:rotate(${exp?'180deg':'0deg'});transition:.15s;">${ICONS.chevron}</span>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Preço final (estim.)</p><p class="item-num accent">${fmtEUR(c.precoFinal)}</p></div>
        <div><p class="stat-label" style="margin:0;">Lucro líquido</p><p class="item-num pos">${fmtEUR(c.lucroLiquido)}</p></div>
        <div><p class="stat-label" style="margin:0;">Preço lojista</p><p class="item-num">${fmtEUR(c.precoLojista)}</p></div>
      </div>
      ${exp ? `
      <div class="breakdown">
        <div class="note" style="margin:0 0 8px;">Custo de matéria-prima estimado com a média do custo dos filamentos cadastrados (${fmtEUR(custoMedioFilamento())}/kg). Na venda, o custo real é recalculado com as cores escolhidas.</div>
        <div class="breakdown-row"><span>Matéria-prima (estim.)</span><span>${fmtEUR(c.custoMateriaPrima)}</span></div>
        <div class="breakdown-row"><span>Energia</span><span>${fmtEUR(c.custoEnergia)}</span></div>
        <div class="breakdown-row"><span>Amortização da máquina</span><span>${fmtEUR(c.custoAmortizacao)}</span></div>
        ${(p.itensAdicionais||[]).map(item=>`<div class="breakdown-row"><span>↳ ${item.descricao||'Item'}</span><span>${fmtEUR(item.custo)}</span></div>`).join('')}
        <div class="breakdown-row"><span>Acessórios/embalagem (total)</span><span>${fmtEUR(c.custoItensAdic)}</span></div>
        <div class="breakdown-row"><span>Custo fixo rateado</span><span>${fmtEUR(c.custoFixoRateado)}</span></div>
        <div class="breakdown-row"><span>Buffer de falhas (${fmtPct(state.config.falhas)})</span><span>—</span></div>
        <div class="breakdown-row total"><span>Custo total (estim.)</span><span>${fmtEUR(c.custoTotal)}</span></div>
        <div class="breakdown-row"><span>Lucro bruto lojista</span><span>${fmtEUR(c.lucroBrutoLojista)}</span></div>
        <div class="breakdown-row"><span>Lucro líquido lojista</span><span>${fmtEUR(c.lucroLiquidoLojista)}</span></div>
      </div>` : ''}
    </div>`;
  });

  return html;
}

/* =========================================================================
   RENDER: ESTOQUE (Materiais + Movimentações)
   ========================================================================= */
function renderEstoque(){
  let html = `<div class="tab-title">Estoque</div><p class="tab-sub">Materiais e movimentações de entrada/saída.</p>`;
  html += `
  <div class="segmented">
    <button class="${ui.estoqueSub==='materiais'?'active':''}" onclick="setEstoqueSub('materiais')">Materiais</button>
    <button class="${ui.estoqueSub==='movimentos'?'active':''}" onclick="setEstoqueSub('movimentos')">Movimentações</button>
  </div>`;

  if(ui.estoqueSub==='materiais') html += renderMateriais();
  else html += renderMovimentacoes();
  return html;
}

function renderMateriais(){
  const showForm = ui.showForm==='material';
  const editing = ui.editing.material;
  const f = editing ? state.materiais.find(m=>m.id===editing) : null;

  let html = `<button class="fab" onclick="toggleForm('material')">${ICONS.plus}${showForm?'Fechar':(editing?'A editar material...':'Novo material')}</button>`;

  if(showForm){
    html += `
    <div class="card">
      <div class="field"><label>Nome</label><input id="f-nome" placeholder="Ex: Filamento PLA Verde" value="${f?f.nome:''}"></div>
      <div class="row-2">

        </div>
        <div class="field"><label>Unidade</label>
          <select id="f-unidade">
            ${['kg','L','un'].map(u=>`<option ${f&&f.unidade===u?'selected':''}>${u}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>Custo padrão (€/unidade)</label><input id="f-custo" type="number" step="0.01" inputmode="decimal" value="${f?f.custoPadrao:''}"></div>
      <div class="btn-row"><button class="btn" onclick="saveMaterial()">${editing?'Guardar alterações':'Adicionar material'}</button></div>
    </div>`;
  }

  if(!state.materiais.length){
    html += `<div class="empty">${ICONS.box}<div>Nenhum material cadastrado.</div></div>`;
  }

  state.materiais.forEach(m=>{
    const s = materialStats(m.id);
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${m.nome}</p>
          <p class="item-meta">${m.tipo} · ${fmtEUR(m.custoPadrao)}/${m.unidade} (padrão)</p>
        </div>
        <div class="item-actions">
          <button class="icon-btn" onclick="editMaterial('${m.id}')">${ICONS.edit}</button>

      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Estoque atual</p><p class="item-num">${s.estoqueAtual.toFixed(2)} ${m.unidade}</p></div>
        <div><p class="stat-label" style="margin:0;">Custo médio</p><p class="item-num">${fmtEUR(s.custoMedio)}</p></div>
        <div><p class="stat-label" style="margin:0;">Valor em estoque</p><p class="item-num accent">${fmtEUR(s.valorEstoque)}</p></div>
      </div>
    </div>`;

function renderMovimentacoes(){
  const showForm = ui.showForm==='movimento';
  const showProd = ui.showForm==='producao';
  const matOptions = state.materiais.map(m=>`<option value="${m.id}">${m.nome}</option>`).join('');
  const prodOptions = state.produtos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');
  const pf_ = ui.producaoForm;

  let html = `
  <div class="btn-row">
    <button class="btn secondary" style="flex:1;" onclick="toggleForm('movimento')">${ICONS.plus} Movimentação manual</button>
    <button class="btn" style="flex:1;" onclick="toggleForm('producao')">${ICONS.cube} Registar produção</button>
  </div>
  <div style="height:12px;"></div>`;

  if(showForm){
    html += `
    <div class="card">
      <div class="row-2">
        <div class="field"><label>Data</label><input id="f-data" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Tipo</label><select id="f-tipo"><option>Entrada</option><option>Saída</option><option>Refugo</option></select></div>
      </div>
      <div class="field"><label>Material</label><select id="f-material">${matOptions || '<option value="">Sem materiais</option>'}</select></div>
      <div class="field"><label>Fornecedor / destino</label><input id="f-origem" placeholder="Ex: Filamentos.pt ou Produção X"></div>
      <div class="field"><label>Nº da fatura (quando compra)</label><input id="f-nfatura" placeholder="Ex: FT-1023"></div>
      <div class="row-2">
        <div class="field"><label>Quantidade</label><input id="f-qtd" type="number" step="0.01" inputmode="decimal"></div>
        <div class="field"><label>Custo unitário (€)</label><input id="f-custounit" type="number" step="0.01" inputmode="decimal"></div>
      </div>
      <div class="field"><label>Observação</label><input id="f-obs" placeholder="Ex: peça falhou na 3ª camada"></div>
      <div class="note">Use "Refugo" para material perdido em impressões falhadas — conta como saída de estoque, separado das saídas normais de produção/venda.</div>
      <div class="btn-row"><button class="btn" onclick="saveMovimento()">Adicionar movimentação</button></div>
    </div>`;
  }

  if(showProd && pf_){
    html += `
    <div class="card">
      <div class="note" style="margin-bottom:10px;">Escolha um produto, a quantidade produzida e as cores usadas — o consumo é calculado e lançado automaticamente como saída de estoque.</div>
      <div class="field"><label>Produto</label><select onchange="updateProducaoFormProduto(this.value)">${produtoOptionsFor(pf_.produto)}</select></div>
      <div class="row-2">
        <div class="field"><label>Quantidade produzida</label><input type="number" step="1" value="${pf_.quantidade}" onchange="updateProducaoForm('quantidade', this.value)"></div>
        <div class="field"><label>Data</label><input type="date" value="${pf_.data}" onchange="updateProducaoForm('data', this.value)"></div>
      </div>
      ${renderColorSelects(pf_.produto, pf_.materiaisEscolhidos, 'updateProducaoFormMaterial')}
      <div class="btn-row"><button class="btn" onclick="registrarProducao()">Registar produção e baixar estoque</button></div>
    </div>`;
  }

  html += `
  <div class="segmented">
    <button class="${ui.movFilter==='todas'?'active':''}" onclick="setMovFilter('todas')">Todas</button>
    <button class="${ui.movFilter==='Entrada'?'active':''}" onclick="setMovFilter('Entrada')">Entradas</button>
    <button class="${ui.movFilter==='Saída'?'active':''}" onclick="setMovFilter('Saída')">Saídas</button>
    <button class="${ui.movFilter==='Refugo'?'active':''}" onclick="setMovFilter('Refugo')">Refugo</button>
  </div>`;

  let list = [...state.movimentacoes].sort((a,b)=>b.data.localeCompare(a.data));
  if(ui.movFilter!=='todas'){ list = list.filter(m=>m.tipo===ui.movFilter); }
  if(!list.length){ html += `<div class="empty">${ICONS.layers}<div>Nenhuma movimentação encontrada.</div></div>`; }

  const tipoBadgeKind = (tipo) => tipo==='Entrada' ? 'entrada' : (tipo==='Refugo' ? 'pendente' : 'saida');

  list.forEach(m=>{
    const mat = state.materiais.find(x=>x.id===m.codigo);
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${mat? mat.nome : 'Material removido'}</p>
          <p class="item-meta">${fmtDate(m.data)} · ${m.origem||'—'}${m.nFatura?' · Fatura '+m.nFatura:''}</p>

        <div class="item-actions">
          ${badge(m.tipo, tipoBadgeKind(m.tipo))}

      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Quantidade</p><p class="item-num">${m.qtd} ${mat?mat.unidade:''}</p></div>
        <div><p class="stat-label" style="margin:0;">Custo unit.</p><p class="item-num">${fmtEUR(m.custoUnit)}</p></div>
        <div><p class="stat-label" style="margin:0;">Total</p><p class="item-num accent">${fmtEUR(m.qtd*m.custoUnit)}</p></div>
      </div>
    </div>`;
  });
  return html;
}

      <div class="field"><label>Categoria</label><select id="f-categoria">${categorias.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Descrição</label><input id="f-descricao" placeholder="Ex: Venda de 2 peças"></div>
      <div class="field"><label>Produto relacionado (opcional)</label><select id="f-produto"><option value="">—</option>${prodOptions}</select></div>
      <div class="row-2">
        <div class="field"><label>Valor (€)</label><input id="f-valor" type="number" step="0.01" inputmode="decimal"></div>
        <div class="field"><label>Forma de pagamento</label><input id="f-forma" placeholder="MB Way, cartão..."></div>
      </div>
      <div class="btn-row"><button class="btn" onclick="saveFinanceiro()">Adicionar lançamento</button></div>
    </div>`;
  }

  const list = [...financeiroOrdenado()].reverse();
  if(!list.length){ html += `<div class="empty">${ICONS.trend}<div>Nenhum lançamento registado.</div></div>`; }

  list.forEach(f=>{
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${f.descricao}</p>
          <p class="item-meta">${fmtDate(f.data)} · ${f.categoria} · ${f.forma||'—'}</p>
        </div>
        <div class="item-actions">
          ${badge(f.tipo, f.tipo==='Entrada'?'entrada':'saida')}
          <button class="icon-btn danger-hover" onclick="deleteItem('financeiro','${f.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Valor</p><p class="item-num ${f.tipo==='Entrada'?'pos':'neg'}">${f.tipo==='Entrada'?'+':'-'}${fmtEUR(f.valor)}</p></div>
        <div><p class="stat-label" style="margin:0;">Saldo acumulado</p><p class="item-num accent">${fmtEUR(f.saldoAcumulado)}</p></div>
      </div>
    </div>`;
  });

  return html;
}

/* =========================================================================
   RENDER: INVESTIMENTO
   ========================================================================= */
function renderInvestimento(){
  const showForm = ui.showForm==='investimento';
  const editing = ui.editing.investimento;
  const f = editing ? state.investimentos.find(i=>i.id===editing) : null;
  const d = painelData();

  let html = `<div class="tab-title">Investimento</div><p class="tab-sub">Equipamento, parcelas e retorno do investimento.</p>`;

  html += `<div class="card">
    <div class="row-2">
      <div><p class="stat-label">Total investido</p><p class="stat-value sm">${fmtEUR(d.totalInvestido)}</p></div>
      <div><p class="stat-label">Ainda em dívida</p><p class="stat-value sm neg">${fmtEUR(d.totalDivida)}</p></div>
    </div>
  </div>`;

  html += `<div class="card">
    <div class="ring-wrap">
      ${ring(d.pctRecuperado, 58, 'var(--teal)')}
      <div>
        <p class="stat-label" style="margin-bottom:2px;">Recuperado (lucro operacional)</p>
        <p class="ring-num">${fmtPct(d.pctRecuperado)}</p>
      </div>
    </div>
    <div class="row-2" style="margin-top:14px;">
      <div><p class="stat-label">Lucro operacional acumulado</p><p class="stat-value sm ${d.lucroOperacional>=0?'pos':'neg'}">${fmtEUR(d.lucroOperacional)}</p></div>
      <div><p class="stat-label">Por recuperar</p><p class="stat-value sm">${fmtEUR(d.valorPorRecuperar)}</p></div>
    </div>
    <div class="note">${d.mesesEstimados!==null? `Estimativa: ${d.mesesEstimados} ${d.mesesEstimados===1?'mês':'meses'} até recuperar tudo, ao ritmo médio atual.` : 'Cadastre produtos e vendas para estimar o prazo de retorno.'} Este cálculo exclui a categoria "Equipamento" do Financeiro, para não contar o investimento duas vezes.</div>
  </div>`;

  html += `<button class="fab" onclick="toggleForm('investimento')">${ICONS.plus}${showForm?'Fechar':(editing?'A editar item...':'Novo item de investimento')}</button>`;

  if(showForm){
    html += `
    <div class="card">
      <div class="field"><label>Item</label><input id="f-item" placeholder="Ex: Bambu Lab A1 Combo" value="${f?f.item:''}"></div>
      <div class="field"><label>Categoria</label>
        <select id="f-categoria">${['Equipamento','Ferramenta','Software','Outro'].map(c=>`<option ${f&&f.categoria===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="row-2">
        <div class="field"><label>Data da compra</label><input id="f-datacompra" type="date" value="${f?f.dataCompra:new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Valor total (€)</label><input id="f-valortotal" type="number" step="0.01" inputmode="decimal" value="${f?f.valorTotal:''}"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Nº de parcelas</label><input id="f-nparcelas" type="number" step="1" min="1" value="${f?f.nParcelas:1}"></div>
        <div class="field"><label>Data da 1ª parcela</label><input id="f-data1parcela" type="date" value="${f?f.data1Parcela:new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Parcelas já pagas</label><input id="f-parcelaspagas" type="number" step="1" min="0" value="${f?f.parcelasPagas:0}"></div>
      <div class="note">Se pagou à vista, use "1" parcela. Atualize "Parcelas já pagas" sempre que fizer um novo pagamento — os cartões abaixo têm botões rápidos +/− para isso.</div>
      <div class="btn-row"><button class="btn" onclick="saveInvestimento()">${editing?'Guardar alterações':'Adicionar item'}</button></div>
    </div>`;
  }

  if(!state.investimentos.length){ html += `<div class="empty">${ICONS.target}<div>Nenhum item de investimento registado.</div></div>`; }

  state.investimentos.forEach(inv=>{
    const c = investimentoCalc(inv);
    const pct = inv.nParcelas>0 ? c.parcelasPagas/inv.nParcelas : 1;
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${inv.item}</p>
          <p class="item-meta">${inv.categoria} · comprado em ${fmtDate(inv.dataCompra)}</p>
        </div>
        <div class="item-actions">
          ${badge(c.status, c.status==='Pago'?'pago':'pendente')}
          <button class="icon-btn" onclick="editInvestimento('${inv.id}')">${ICONS.edit}</button>
          <button class="icon-btn danger-hover" onclick="deleteItem('investimentos','${inv.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Valor total</p><p class="item-num">${fmtEUR(inv.valorTotal)}</p></div>
        <div><p class="stat-label" style="margin:0;">Parcelas</p><p class="item-num">${c.parcelasPagas}/${inv.nParcelas}</p></div>
        <div><p class="stat-label" style="margin:0;">Em falta</p><p class="item-num neg">${fmtEUR(c.valorEmFalta)}</p></div>
      </div>
      <div class="pbar-track"><div class="pbar-fill" style="width:${(pct*100).toFixed(0)}%;"></div></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn secondary" style="flex:1;" onclick="bumpParcela('${inv.id}', -1)" ${c.parcelasPagas<=0?'disabled':''}>− Parcela paga</button>
        <button class="btn secondary" style="flex:1;" onclick="bumpParcela('${inv.id}', 1)" ${c.parcelasPagas>=inv.nParcelas?'disabled':''}>+ Marcar parcela paga</button>
      </div>
    </div>`;
  });

  return html;
}

/* =========================================================================
   RENDER: VENDAS & ORCAMENTOS
   ========================================================================= */
function renderVendas(){
  let html = `<div class="tab-title">Vendas</div><p class="tab-sub">Registo de vendas e orçamentos para clientes.</p>`;
  html += `
  <div class="segmented">
    <button class="${ui.vendasSub==='vendas'?'active':''}" onclick="setVendasSub('vendas')">Vendas</button>
    <button class="${ui.vendasSub==='orcamentos'?'active':''}" onclick="setVendasSub('orcamentos')">Orçamentos</button>
  </div>`;
  if(ui.vendasSub==='vendas') html += renderVendasList();
  else html += renderOrcamentos();
  return html;
}

function clienteTipoOptions(selected){
  return ['Consumidor Final','Lojista'].map(t=>`<option value="${t}" ${selected===t?'selected':''}>${t}</option>`).join('');
}
function produtoOptionsFor(selected){
  return `<option value="">— selecionar —</option>` + state.produtos.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${p.nome}</option>`).join('');
}

function materialOptionsFor(selectedId){
  return `<option value="">— selecionar —</option>` + state.materiais.map(m=>`<option value="${m.id}" ${selectedId===m.id?'selected':''}>${m.nome}</option>`).join('');
}

function renderColorSelects(produtoId, materiaisEscolhidos, updateFnName, itemIndex, compact){
  const produto = state.produtos.find(p=>p.id===produtoId);
  if(!produto || !(produto.partes||[]).length) return '';
  const argPrefix = itemIndex!==undefined ? (itemIndex+', ') : '';
  const fieldClass = compact ? 'field compact' : 'field';
  return `
    <label style="display:block;font-size:${compact?'9.5':'11'}px;color:var(--text-dim);margin:${compact?'8px 0 5px':'12px 0 7px'};text-transform:uppercase;letter-spacing:.6px;">Cores usadas nesta peça</label>
    ${produto.partes.map((parte,i)=>`
      <div class="${fieldClass}"><label>Cor ${i+1} (${parte.peso}g)</label>
        <select onchange="${updateFnName}(${argPrefix}${i}, this.value)">${materialOptionsFor(materiaisEscolhidos[i])}</select>
      </div>
    `).join('')}
  `;
}

function renderItensForm(itens, prefixoUpdateFn){
  return `
    <label style="display:block;font-size:11px;color:var(--text-dim);margin:14px 0 7px;text-transform:uppercase;letter-spacing:.6px;">Itens do pedido</label>
    ${itens.map((item,i)=>{
      const produto = state.produtos.find(p=>p.id===item.produto);
      return `
      <div class="card tight item-row-box" style="background:var(--surface-2);">
        <div style="display:flex;gap:7px;align-items:flex-end;">
          <div class="field compact" style="flex:2;margin-bottom:0;"><label>Produto</label>
            <select onchange="${prefixoUpdateFn}Produto(${i}, this.value)">${produtoOptionsFor(item.produto)}</select>
          </div>
          <div class="field compact" style="flex:1;margin-bottom:0;"><label>Qtd</label>
            <input type="number" step="1" value="${item.quantidade}" onchange="${prefixoUpdateFn}Qtd(${i}, this.value)">
          </div>
          ${itens.length>1 ? `<button class="icon-btn danger-hover" style="padding:7px 6px;" onclick="${prefixoUpdateFn}Remover(${i})">${ICONS.trash}</button>` : ''}
        </div>
        ${produto ? renderColorSelects(item.produto, item.materiaisEscolhidos, `${prefixoUpdateFn}Material`, i, true) : ''}
      </div>`;
    }).join('')}
    <button class="btn secondary" style="margin-bottom:12px;" onclick="${prefixoUpdateFn}Adicionar()">${ICONS.plus} Adicionar outro item</button>
  `;
}

function renderVendasList(){
  const showForm = ui.showForm==='venda';
  const vf = ui.vendaForm;
  const d = painelData();

  let html = `<div class="row-3">
    <div class="card tight"><p class="stat-label">Vendido</p><p class="stat-value sm pos">${fmtEUR(d.totalVendido)}</p></div>
    <div class="card tight"><p class="stat-label">Lucro</p><p class="stat-value sm pos">${fmtEUR(d.lucroVendas)}</p></div>
    <div class="card tight"><p class="stat-label">Nº vendas</p><p class="stat-value sm">${d.numVendas}</p></div>
  </div>`;

  html += `<button class="fab" onclick="toggleForm('venda')">${ICONS.plus}${showForm?'Fechar':'Nova venda'}</button>`;

  if(showForm && vf){
    const sugestaoCalc = vendaCalc(vf);
    html += `
    <div class="card">
      <div class="field"><label>Cliente</label><input value="${vf.cliente}" placeholder="Nome do cliente" onchange="updateVendaForm('cliente', this.value)"></div>
      <div class="field"><label>NIF do cliente (opcional)</label><input value="${vf.nifCliente||''}" placeholder="Contribuinte, se aplicável" onchange="updateVendaForm('nifCliente', this.value)"></div>
      <div class="field"><label>Tipo de cliente</label><select onchange="updateVendaForm('tipoCliente', this.value)">${clienteTipoOptions(vf.tipoCliente)}</select></div>
      <div class="field"><label>Desconto no pedido inteiro (%)</label><input type="number" step="1" value="${vf.desconto*100}" onchange="updateVendaForm('desconto', this.value/100)"></div>

      ${renderItensForm(vf.itens, 'updateVendaFormItem')}

      <div class="row-2" style="margin-top:12px;">
        <div class="field"><label>Valor sugerido (€)</label><input type="text" value="${sugestaoCalc.totalCalculado.toFixed(2).replace('.',',')}" disabled style="opacity:.55;"></div>
        <div class="field"><label>Valor real vendido (€)</label><input type="text" inputmode="decimal" value="${vf.valorReal}" placeholder="Ex: 45,00" onchange="updateVendaForm('valorReal', this.value)"></div>
      </div>
      <div class="note">"Valor sugerido" soma todos os itens (preço × quantidade, com o custo real das cores escolhidas) menos o desconto, e não pode ser editado. Preencha "Valor real vendido" com o que realmente recebeu — se deixar em branco, o valor sugerido é usado.</div>
      <div class="field"><label>Forma de pagamento</label><input value="${vf.forma}" placeholder="MB Way, cartão..." onchange="updateVendaForm('forma', this.value)"></div>
      <div class="field"><label>Data</label><input type="date" value="${vf.data}" onchange="updateVendaForm('data', this.value)"></div>
      <div class="field"><label>Observação</label><input value="${vf.obs}" placeholder="Opcional" onchange="updateVendaForm('obs', this.value)"></div>
      <div class="note">Ao guardar, isto cria automaticamente uma entrada em Financeiro e baixa o estoque dos materiais usados de todos os itens.</div>
      <div class="btn-row"><button class="btn" onclick="saveVenda()">Registar venda</button></div>
    </div>`;
  }

  const list = [...state.vendas].sort((a,b)=>b.data.localeCompare(a.data));
  if(!list.length){ html += `<div class="empty">${ICONS.trend}<div>Nenhuma venda registada.</div></div>`; }

  list.forEach(v=>{
    const c = vendaCalc(v);
    const pctLucro = c.total>0 ? (c.lucro/c.total)*100 : 0;
    const descricaoItens = (v.itens||[]).map(it=>{
      const p = state.produtos.find(x=>x.id===it.produto);
      return `${p?p.nome:'produto removido'} ×${it.quantidade}`;
    }).join(', ');
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${v.cliente} ${c.temValorManual?badge('valor real','pago'):''}</p>
          <p class="item-meta">${fmtDate(v.data)} · ${descricaoItens} · ${v.tipoCliente}${v.nifCliente?' · NIF '+v.nifCliente:''}</p>
        </div>
        <div class="item-actions">
          <button class="icon-btn danger-hover" onclick="deleteItem('vendas','${v.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Total</p><p class="item-num accent">${fmtEUR(c.total)}</p></div>
        <div><p class="stat-label" style="margin:0;">Lucro</p><p class="item-num pos">${fmtEUR(c.lucro)}</p></div>
        <div><p class="stat-label" style="margin:0;">% Lucro</p><p class="item-num pos">${pctLucro.toFixed(1)}%</p></div>
      </div>
    </div>`;
  });
  return html;
}

function renderOrcamentos(){
  const showForm = ui.showForm==='orcamento';
  const of_ = ui.orcamentoForm;

  let html = `<button class="fab" onclick="toggleForm('orcamento')">${ICONS.plus}${showForm?'Fechar':'Novo orçamento'}</button>`;

  if(showForm && of_){
    const sugestaoCalc = orcamentoCalc(of_);
    html += `
    <div class="card">
      <div class="field"><label>Cliente</label><input value="${of_.cliente}" placeholder="Nome do cliente" onchange="updateOrcamentoForm('cliente', this.value)"></div>
      <div class="field"><label>NIF do cliente (opcional)</label><input value="${of_.nifCliente||''}" placeholder="Contribuinte, se aplicável" onchange="updateOrcamentoForm('nifCliente', this.value)"></div>
      <div class="field"><label>Tipo de cliente</label><select onchange="updateOrcamentoForm('tipoCliente', this.value)">${clienteTipoOptions(of_.tipoCliente)}</select></div>
      <div class="row-2">
        <div class="field"><label>Desconto no pedido inteiro (%)</label><input type="number" step="1" value="${of_.desconto*100}" onchange="updateOrcamentoForm('desconto', this.value/100)"></div>
        <div class="field"><label>Validade</label><input type="date" value="${of_.validade}" onchange="updateOrcamentoForm('validade', this.value)"></div>
      </div>

      ${renderItensForm(of_.itens, 'updateOrcamentoFormItem')}

      <div class="row-2" style="margin-top:12px;">
        <div class="field"><label>Valor sugerido (€)</label><input type="text" value="${sugestaoCalc.totalCalculado.toFixed(2).replace('.',',')}" disabled style="opacity:.55;"></div>
        <div class="field"><label>Valor real do orçamento (€)</label><input type="text" inputmode="decimal" value="${of_.valorReal}" placeholder="Ex: 45,00" onchange="updateOrcamentoForm('valorReal', this.value)"></div>
      </div>
      <div class="note">"Valor sugerido" soma todos os itens e não pode ser editado. Preencha "Valor real do orçamento" se propôs um valor diferente ao cliente — se deixar em branco, o valor sugerido é usado.</div>
      <div class="field"><label>Observação</label><input value="${of_.obs}" placeholder="Opcional" onchange="updateOrcamentoForm('obs', this.value)"></div>
      <div class="btn-row"><button class="btn" onclick="saveOrcamento()">Criar orçamento</button></div>
    </div>`;
  }

  const list = [...state.orcamentos].sort((a,b)=>b.data.localeCompare(a.data));
  if(!list.length){ html += `<div class="empty">${ICONS.target}<div>Nenhum orçamento registado.</div></div>`; }

  const statusKind = (s)=> (s==='Aceite'||s==='Convertido') ? 'pago' : (s==='Recusado'||s==='Expirado' ? 'saida' : 'pendente');

  list.forEach(o=>{
    const c = orcamentoCalc(o);
    const descricaoItens = (o.itens||[]).map(it=>{
      const p = state.produtos.find(x=>x.id===it.produto);
      return `${p?p.nome:'produto removido'} ×${it.quantidade}`;
    }).join(', ');
    html += `
    <div class="item">
      <div class="item-top">
        <div>
          <p class="item-title">${o.codigo} · ${o.cliente} ${c.temValorManual?badge('valor real','pago'):''}</p>
          <p class="item-meta">${fmtDate(o.data)} · ${descricaoItens} · válido até ${fmtDate(o.validade)}${o.nifCliente?' · NIF '+o.nifCliente:''}</p>
        </div>
        <div class="item-actions">
          ${badge(o.status, statusKind(o.status))}
          <button class="icon-btn danger-hover" onclick="deleteItem('orcamentos','${o.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div class="item-foot">
        <div><p class="stat-label" style="margin:0;">Total</p><p class="item-num accent">${fmtEUR(c.total)}</p></div>
        <div><p class="stat-label" style="margin:0;">Lucro</p><p class="item-num pos">${fmtEUR(c.lucro)}</p></div>
        <div><p class="stat-label" style="margin:0;">% Lucro</p><p class="item-num pos">${(c.total>0 ? (c.lucro/c.total)*100 : 0).toFixed(1)}%</p></div>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        ${o.status==='Pendente' ? `<button class="btn secondary" style="flex:1;" onclick="setOrcamentoStatus('${o.id}','Aceite')">Marcar aceite</button>
        <button class="btn ghost" style="flex:1;" onclick="setOrcamentoStatus('${o.id}','Recusado')">Recusar</button>` : ''}
        ${o.status==='Aceite' ? `<button class="btn" style="flex:1;" onclick="converterOrcamentoEmVenda('${o.id}')">Converter em venda</button>` : ''}
      </div>
    </div>`;
  });
  return html;
}

function renderCloudSection(){
  if(!cloudConfig){
    if(!ui2.showCloudForm){
      return `
      <div class="card">
        <p style="font-size:13px;color:var(--text-dim);margin:0 0 12px;">Sem sincronização configurada — os dados ficam só neste aparelho/navegador. Configure a nuvem para aceder aos mesmos dados de qualquer telemóvel ou computador.</p>
        <button class="btn" onclick="ui2.showCloudForm=true; render();">Configurar sincronização na nuvem</button>
      </div>`;
    }
    return `
    <div class="card">
      <p style="font-size:13px;color:var(--text-dim);margin:0 0 10px;">Cole aqui a configuração do seu projeto Firebase (veja o guia "COMO_ATIVAR_NUVEM.md"). Isto fica guardado só neste navegador.</p>
      <div class="field"><label>Configuração Firebase (JSON)</label>
        <textarea id="f-cloudconfig" rows="6" style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 11px;font-family:var(--font-mono);font-size:12px;" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'></textarea>
      </div>
      ${ui2.authError ? `<div class="note" style="color:var(--danger);">${ui2.authError}</div>` : ''}
      <div class="btn-row">
        <button class="btn ghost" style="flex:1;" onclick="ui2.showCloudForm=false; render();">Cancelar</button>
        <button class="btn" style="flex:1;" onclick="saveCloudConfigFromForm()">Guardar e continuar</button>
      </div>
    </div>`;
  }

  if(!currentUser){
    return `
    <div class="card">
      <div class="segmented">
        <button class="${ui2.authMode==='login'?'active':''}" onclick="ui2.authMode='login'; ui2.authError=''; render();">Iniciar sessão</button>
        <button class="${ui2.authMode==='signup'?'active':''}" onclick="ui2.authMode='signup'; ui2.authError=''; render();">Criar conta</button>
      </div>
      <div class="field"><label>E-mail</label><input id="f-authemail" type="email" placeholder="voce@email.com"></div>
      <div class="field"><label>Password</label><input id="f-authpass" type="password" placeholder="mínimo 6 caracteres"></div>
      ${ui2.authError ? `<div class="note" style="color:var(--danger);margin-bottom:8px;">${ui2.authError}</div>` : ''}
      <div class="btn-row">
        <button class="btn" style="flex:1;" ${ui2.authBusy?'disabled':''} onclick="submitAuthForm()">${ui2.authBusy ? 'A processar…' : (ui2.authMode==='login' ? 'Iniciar sessão' : 'Criar conta')}</button>
      </div>
      ${ui2.authMode==='login' ? `<button class="btn ghost" style="width:100%;margin-top:8px;" onclick="cloudResetPassword(document.getElementById('f-authemail').value)">Esqueci a password</button>` : ''}
      <div class="note" style="margin-top:10px;">Isto liga-se ao projeto Firebase configurado. <a href="#" onclick="event.preventDefault(); clearCloudConfig(); render();" style="color:var(--text-dim);">Usar outra configuração</a></div>
    </div>`;
  }

  return `
  <div class="card">
    <p class="stat-label">Sincronizado como</p>
    <p style="font-size:14px;font-weight:700;margin:2px 0 14px;">${currentUser.email}</p>
    <button class="btn secondary" onclick="cloudLogout()">Terminar sessão</button>
    <div class="note" style="margin-top:10px;">Os seus dados estão guardados na nuvem e sincronizam automaticamente em qualquer aparelho onde iniciar sessão com este e-mail.</div>
  </div>`;
}

function saveCloudConfigFromForm(){
  const raw = document.getElementById('f-cloudconfig').value.trim();
  let cfg;
  try{ cfg = JSON.parse(raw); }
  catch(e){ ui2.authError = 'JSON inválido. Copie exatamente o objeto de configuração do Firebase.'; render(); return; }
  if(!cfg.apiKey || !cfg.projectId){ ui2.authError = 'Faltam campos na configuração (apiKey/projectId).'; render(); return; }
  ui2.authError = '';
  ui2.showCloudForm = false;
  saveCloudConfig(cfg);
  initFirebase();
  render();
}
function submitAuthForm(){
  const email = document.getElementById('f-authemail').value.trim();
  const pass = document.getElementById('f-authpass').value;
  if(!email || !pass){ ui2.authError = 'Preencha e-mail e password.'; render(); return; }
  if(ui2.authMode==='signup') cloudSignup(email, pass);
  else cloudLogin(email, pass);
}

  const item = document.getElementById('f-item').value.trim();
  const categoria = document.getElementById('f-categoria').value;
  const dataCompra = document.getElementById('f-datacompra').value;
  const valorTotal = num(document.getElementById('f-valortotal').value);
  const nParcelas = Math.max(1, parseInt(document.getElementById('f-nparcelas').value)||1);
  const data1Parcela = document.getElementById('f-data1parcela').value;
  const parcelasPagas = Math.max(0, Math.min(nParcelas, parseInt(document.getElementById('f-parcelaspagas').value)||0));
  if(!item){ alert('Indique o item comprado.'); return; }
  if(valorTotal<=0){ alert('Indique um valor total válido.'); return; }
  if(ui.editing.investimento){
    const inv = state.investimentos.find(x=>x.id===ui.editing.investimento);
    Object.assign(inv, {item, categoria, dataCompra, valorTotal, nParcelas, data1Parcela, parcelasPagas});
    ui.editing.investimento = null;
  } else {
    state.investimentos.push({id:uid('inv'), item, categoria, dataCompra, valorTotal, nParcelas, data1Parcela, parcelasPagas});
  }
  ui.showForm = null;
  persistAndRender();
}
function bumpParcela(id, delta){
  const inv = state.investimentos.find(x=>x.id===id);
  if(!inv) return;
  const atual = num(inv.parcelasPagas);
  const novo = Math.max(0, Math.min(inv.nParcelas, atual + delta));
  if(novo === atual) return;
  const calc = investimentoCalc(inv);
  if(delta > 0){
    // marcar parcela como paga: lanca a saida de caixa correspondente
    state.financeiro.push({
      id:uid('fin'), data:new Date().toISOString().slice(0,10), tipo:'Saída', categoria:'Equipamento',
      descricao:`Pagamento de parcela ${novo}/${inv.nParcelas} - ${inv.item}`,
      produto:'', valor:Math.round(calc.valorParcela*100)/100, forma:''
    });
  } else {
    // desmarcar: remove o lancamento de saida mais recente referente a este investimento, se existir
    const idx = [...state.financeiro].map((f,i)=>({f,i}))
      .reverse()
      .find(({f}) => f.categoria==='Equipamento' && f.descricao.includes(inv.item) && f.descricao.startsWith('Pagamento de parcela'));
    if(idx) state.financeiro.splice(idx.i, 1);
  }
  inv.parcelasPagas = novo;
  persistAndRender();
}

                 forma:(vf.forma||'').trim(), obs:(vf.obs||'').trim()};

function setOrcamentoStatus(id, status){
  const o = state.orcamentos.find(x=>x.id===id);
  if(!o) return;
  o.status = status;
  persistAndRender();
}
function converterOrcamentoEmVenda(id){
  const o = state.orcamentos.find(x=>x.id===id);
  if(!o) return;
  const itens = (o.itens||[]).map(it=>({...it, materiaisEscolhidos:[...(it.materiaisEscolhidos||[])]}));
  if(!itens.length){ alert('Este orçamento não tem itens.'); return; }
  const data = new Date().toISOString().slice(0,10);
  const venda = {id:uid('ven'), data, cliente:o.cliente, nifCliente:o.nifCliente||'', itens,
                 tipoCliente:o.tipoCliente, desconto:o.desconto,
                 valorReal:o.valorReal ?? null, forma:'', obs:`Convertido do orçamento ${o.codigo}`};
  const calc = vendaCalc(venda);
  state.vendas.push(venda);
  const descricaoItens = itens.map(it=>{
    const p = state.produtos.find(x=>x.id===it.produto);
    return `${p?p.nome:'produto'} x${it.quantidade}`;
  }).join(', ');
  state.financeiro.push({
    id:uid('fin'), data, tipo:'Entrada', categoria:'Venda',
    descricao:`Venda: ${descricaoItens} - ${o.cliente} (orçamento ${o.codigo})`,
    produto:itens[0].produto, valor:Math.round(calc.total*100)/100, forma:''
  });
  const movs = gerarMovimentosParaItens(itens, `Venda - ${o.cliente}`, data);
  state.movimentacoes.push(...movs);
  o.status = 'Convertido';
  persistAndRender();
}

function resetData(){
  if(confirm('Isto vai apagar todos os dados guardados e repor os dados de exemplo. Continuar?')){
    state = seedState();
    ui = { tab: ui.tab, estoqueSub:'materiais', expanded:{}, editing:{} };
    persistAndRender();
  }
}

/* =========================================================================
   NAV & ROUTER
   ========================================================================= */
const TABS = [
  {id:'painel', label:'Painel', icon:'grid', render:renderPainel},
  {id:'produtos', label:'Produtos', icon:'cube', render:renderProdutos},
  {id:'estoque', label:'Estoque', icon:'layers', render:renderEstoque},
  {id:'vendas', label:'Vendas', icon:'tag', render:renderVendas},
  {id:'financeiro', label:'Financeiro', icon:'trend', render:renderFinanceiro},
  {id:'investimento', label:'Investimento', icon:'target', render:renderInvestimento},
  {id:'config', label:'Config', icon:'gear', render:renderConfig},
];

function setTab(id){ ui.tab = id; ui.showForm=null; render(); window.scrollTo(0,0); }

function renderNav(){
  document.getElementById('navbar').innerHTML = TABS.map(t=>`
    <button class="navbtn ${ui.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${ICONS[t.icon]}<span>${t.label}</span>
    </button>`).join('');
}

function renderCloudBadge(){
  const el = document.getElementById('cloud-badge');
  if(!el) return;
  if(!cloudConfig){
    el.innerHTML = '';
    return;
  }
  if(cloudSyncing){
    el.innerHTML = `<span class="badge" style="background:var(--surface-3);color:var(--text-faint);">a sincronizar…</span>`;
  } else if(currentUser){
    el.innerHTML = `<span class="badge pago">☁ sincronizado</span>`;
  } else {
    el.innerHTML = `<span class="badge pendente">☁ sem sessão</span>`;
  }
}

function render(){
  try{
    const tab = TABS.find(t=>t.id===ui.tab) || TABS[0];
    document.getElementById('content').innerHTML = tab.render();
    renderNav();
    renderCloudBadge();
  }catch(err){
    console.error('Erro ao desenhar a interface:', err);
    showFatalError(err);
  }
}

function showFatalError(err){
  const el = document.getElementById('content');
  if(!el) return;
  el.innerHTML = `
    <div class="card" style="border-color:var(--danger);">
      <p class="stat-label" style="color:var(--danger);">Ocorreu um erro ao carregar</p>
      <p style="font-size:13px;color:var(--text-dim);margin:8px 0;">${(err && err.message) ? err.message : String(err)}</p>
      <div class="btn-row">
        <button class="btn secondary" style="flex:1;" onclick="location.reload()">Recarregar</button>
        <button class="btn danger" style="flex:1;" onclick="resetData()">Repor dados de exemplo</button>
      </div>
      <p class="note" style="margin-top:10px;">Se isto continuar a acontecer, copie a mensagem de erro acima e envie-a para eu poder corrigir.</p>
    </div>`;
}

window.addEventListener('error', (e) => {
  console.error('Erro global capturado:', e.error || e.message);
  showFatalError(e.error || {message: e.message});
});

try{
  loadState();
}catch(err){
  console.error('Erro ao iniciar:', err);
  showFatalError(err);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline support is optional, ignore failures */ });
  });
}
</script>
