function exportData(){
  try{
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spool-dados-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.error('Erro ao exportar', e);
    alert('Não foi possível exportar os dados.');
  }
}

function exportDataCSV(){
  try{
    const rows = [];
    rows.push(['Tipo','Data','Descrição','Valor/Qtd','Categoria/Extra']);
    (state.financeiro||[]).forEach(f=>{
      rows.push(['Financeiro', f.data||'', f.descricao||'', f.valor!=null?String(f.valor):'', f.tipo||'']);
    });
    (state.vendas||[]).forEach(v=>{
      const c = vendaCalc(v);
      rows.push(['Venda', v.data||'', `${v.cliente||''} - ${itensResumoTexto(c.detalhes)}`, c.total!=null?String(c.total):'', v.vendedor||'']);
    });
    (state.movimentacoes||[]).forEach(m=>{
      rows.push(['Movimentação', m.data||'', m.descricao||m.codMaterial||'', m.quantidade!=null?String(m.quantidade):'', m.tipo||'']);
    });
    (state.materiais||[]).forEach(m=>{
      rows.push(['Material', '', m.nome||m.codMaterial||'', m.estoque!=null?String(m.estoque):'', m.custoMedio!=null?('custo médio '+m.custoMedio):'']);
    });
    (state.produtos||[]).forEach(p=>{
      rows.push(['Produto', '', p.nome||'', p.precoFinal!=null?String(p.precoFinal):'', '']);
    });
    (state.investimentos||[]).forEach(i=>{
      rows.push(['Investimento', i.data||'', i.descricao||'', i.valor!=null?String(i.valor):'', 'parcelas pagas: '+(i.parcelasPagas||0)]);
    });
    const csv = rows.map(r => r.map(cell => {
      const s = String(cell).replace(/"/g,'""');
      return /[",;\n]/.test(s) ? '"'+s+'"' : s;
    }).join(';')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type: 'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spool-dados-' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.error('Erro ao exportar CSV', e);
    alert('Não foi possível exportar os dados em CSV.');
  }
}

function triggerImportData(){
  document.getElementById('import-file-input').click();
}

function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!confirm('Isto vai substituir todos os dados atuais pelos dados do ficheiro importado. Continuar?')) { input.value=''; return; }
      state = parsed;
      migrateState();
      ui = { tab: ui.tab, estoqueSub:'materiais', expanded:{}, editing:{} };
      persistAndRender();
      alert('Dados importados com sucesso.');
    }catch(err){
      console.error('Erro ao importar', err);
      alert('Ficheiro inválido — não foi possível importar os dados.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

/* =========================================================================
   NAV & ROUTER
   ========================================================================= */
const TABS = [
  {id:'painel', label:'Painel', icon:'grid', render:renderPainel},
  {id:'produtos', label:'Produtos', icon:'cube', render:renderProdutos},
  {id:'estoque', label:'Estoque', icon:'layers', render:renderEstoque},
  {id:'vendas', label:'Vendas', icon:'tag', render:renderVendas},
  {id:'financeiro', label:'Financeiro', icon:'trend', render:renderFinanceiro},
  {id:'investimento', label:'Investimento', icon:'target', render:renderInvestimento},
  {id:'config', label:'Config', icon:'gear', render:renderConfig},
];

function setTab(id){ ui.tab = id; ui.showForm=null; render(); window.scrollTo(0,0); }

function renderNav(){
  document.getElementById('navbar').innerHTML = TABS.map(t=>`
    <button class="navbtn ${ui.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${ICONS[t.icon]}<span>${t.label}</span>
    </button>`).join('');
}

function renderCloudBadge(){
  const el = document.getElementById('cloud-badge');
  if(!el) return;
  if(!cloudConfig){
    el.innerHTML = '';
    return;
  }
  if(cloudSyncing){
    el.innerHTML = `<span class="badge" style="background:var(--surface-3);color:var(--text-faint);">a sincronizar…</span>`;
  } else if(currentUser){
    el.innerHTML = `<span class="badge pago">☁ sincronizado</span>`;
  } else {
    el.innerHTML = `<span class="badge pendente">☁ sem sessão</span>`;
  }
}

function render(){
  try{
    const tab = TABS.find(t=>t.id===ui.tab) || TABS[0];
    document.getElementById('content').innerHTML = tab.render();
    renderNav();
    renderCloudBadge();
  }catch(err){
    console.error('Erro ao desenhar a interface:', err);
    showFatalError(err);
  }
}

function showFatalError(err){
  const el = document.getElementById('content');
  if(!el) return;
  el.innerHTML = `
    <div class="card" style="border-color:var(--danger);">
      <p class="stat-label" style="color:var(--danger);">Ocorreu um erro ao carregar</p>
      <p style="font-size:13px;color:var(--text-dim);margin:8px 0;">${(err && err.message) ? err.message : String(err)}</p>
      <div class="btn-row">
        <button class="btn secondary" style="flex:1;" onclick="location.reload()">Recarregar</button>
        <button class="btn danger" style="flex:1;" onclick="resetData()">Repor dados de exemplo</button>
      </div>
      <p class="note" style="margin-top:10px;">Se isto continuar a acontecer, copie a mensagem de erro acima e envie-a para eu poder corrigir.</p>
    </div>`;
}

window.addEventListener('error', (e) => {
  console.error('Erro global capturado:', e.error || e.message);
  showFatalError(e.error || {message: e.message});
});

try{
  loadState();
}catch(err){
  console.error('Erro ao iniciar:', err);
  showFatalError(err);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline support is optional, ignore failures */ });
  });
}
</script>
